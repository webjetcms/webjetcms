<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebJET CMS</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="WebJET CMS Documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Theme: Simple -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <base href="/">
  <script>
    var languages = ['sk', 'en', 'cs'];
    var path = window.location.pathname;
    var historyRoot = path.match(/^\/(latest|v[0-9]+)(?:\/|$)/);
    var isRootLanguagePath = languages.includes(path.split('/')[1]);
    var basePath = path.replace(/index\.(html|jsp)$/, "");
    if (historyRoot) basePath = "/" + historyRoot[1] + "/";
    else if (isRootLanguagePath) basePath = "/";
    if (!basePath.endsWith("/")) basePath += "/";
    // Keep versioned and root-level language URLs in history mode.
    // Other deployments use hash routes without requiring server-side URL rewriting.
    var useHashRouter = !historyRoot && !isRootLanguagePath;
    document.querySelector("base").href = basePath;
  </script>

  <link rel="icon" type="image/x-icon" href="assets/images/favicon-cms.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      name: 'WebJET CMS',
      nameLink: basePath,
      repo: 'https://github.com/webjetcms/webjetcms',
      logo: basePath+'assets/images/logo.png',
      basePath: useHashRouter ? basePath : "/",
      routerMode: useHashRouter ? 'hash' : 'history',
      auto2top: true, //Scrolls to the top of the screen when the route is changed.
      loadSidebar: true,
      loadNavbar: true, //Loads navbar from the Markdown file _navbar.md
      mergeNavbar: true,
      maxLevel: 6,
      subMaxLevel: 6,
      copyCode: {
          buttonText: 'Skopírovať do schránky',
          errorText: 'Chyba',
          successText: 'Skopírované'
      },
      executeScript: true,
      nativeEmoji: true,
      markdown: function (marked, renderer) {
        return configureMarkdown(marked, renderer);
      },
      notFoundPage: {
        '/': '/_404.md'
      },
      relativePath: useHashRouter,
      tabs: {
        persist: false,
        sync: false,
        theme: 'classic', // default
        tabComments: true, // default
        tabHeadings: true // default
      }
    }
  </script>
  <script src="assets/semantic-search.js"></script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- docsify-themeable -->
  <script src="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <!-- docsify-tabs (latest v1.x.x) https://jhildenbiddle.github.io/docsify-tabs/#/ -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>

  <!-- https://github.com/Leward/mermaid-docsify -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true });
    window.mermaid = mermaid;
  </script>
  <script src="//unpkg.com/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>

  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.js"></script>

  <script>
    // Adapt rendered links to WebJET documentation routes.
    function configureMarkdown(marked, renderer) {
      const originalRender = renderer.link;
      renderer.link = function(href, title, text) {
          if (href.indexOf("/src/test/")!=-1 || href.indexOf("/src/main/")!=-1 || href.indexOf("/src/webjet8/")!=-1) {
            var i = href.indexOf("/src/");
            href = "https://github.com/webjetcms/webjetcms/tree/main"+href.substring(i);
          }

          // Docsify handles anchors and external URLs, including mailto: and tel: links.
          if (href.startsWith('#') || href.startsWith('//') || /^[a-z][a-z0-9+.-]*:/i.test(href)) {
            return originalRender(href, title, text);
          }

          // Both routers use the same document-relative paths, without the deployment prefix.
          const documentPath = useHashRouter
            ? window.location.hash.substring(1).split('?')[0]
            : window.location.pathname.substring(basePath.length - 1);
          const language = (documentPath.match(/^\/([a-z]{2,3}(?:-[a-z0-9]{2,6})?)(?:\/|$)/i) || [null, 'sk'])[1];
          const isAttachment = /\.(zip|xlsx?|pdf|docx?)(?:[?#]|$)/i.test(href);

          // Strip an existing deployment prefix before adding it once to the final URL.
          if (basePath !== '/' && href.startsWith(basePath)) {
            href = '/' + href.substring(basePath.length);
          }
          const javadocIndex = href.indexOf('/javadoc/');
          if (javadocIndex !== -1) {
            // Javadoc is shared by languages; preserve its legacy frame entry point.
            let javadocPath = href.substring(javadocIndex + '/javadoc/'.length);
            if (href.includes('/developer/javadoc/') && javadocPath !== 'index.html') {
              javadocPath = 'index.html?' + javadocPath;
            }
            href = '/javadoc/' + javadocPath;
          } else if (href.startsWith('/') && !languages.includes(href.split('/')[1]) &&
                     !href.startsWith('/' + language + '/')) {
            // Sidebar links omit the language; explicit language switches keep their prefix.
            href = '/' + language + href;
          }

          // URL resolves ../ segments before either router receives the link.
          const target = new URL(href, window.location.origin + documentPath);
          const targetPath = target.pathname.substring(1) + target.search + target.hash;
          if (javadocIndex !== -1 || isAttachment) {
            // :ignore prevents .md suffixes; the handler prevents same-origin click interception.
            return originalRender(basePath + targetPath, (title || '') + ' :ignore :target=_blank', text)
              .replace('target="_blank"', 'target="_blank" onclick="handleExternalClick(this, event)"');
          }

          // Docsify adds the hash and removes .md; history URLs also need the deployment prefix.
          return originalRender((useHashRouter ? '/' : basePath) + targetPath, title, text);
      }
      marked.setOptions({ renderer: renderer });
      return marked;
    }
    function handleExternalClick(link, event) {
      event.preventDefault();
      //prevent docsify onclick event
      event.stopPropagation();
      window.open(link.href, '_blank');
    }

    var route = useHashRouter ? window.location.hash.substring(1) : window.location.pathname.substring(basePath.length);
    if (!route || route === "/" || route === "index.html") {
      try {
          var language = navigator.languages
              ? navigator.languages[0]
              : (navigator.language || navigator.userLanguage);

          //console.log("Redirecting to language: ", language, "basePath=", basePath, "pathname=", window.location.pathname);

          var languageRoot = basePath + (useHashRouter ? "#/" : "");
          if (language.indexOf("sk")!=-1) window.location.replace(languageRoot+"sk/");
          else if (language.indexOf("cs")!=-1 || language.indexOf("cz")!=-1) window.location.replace(languageRoot+"cs/");
          else window.location.replace(languageRoot+"en/");
      } catch (e) {
          console.log(e);
      }
    }

  </script>

</body>
</html>

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main", "hotfix/2026.0-main" ]
  pull_request:
    branches: [ "main", "hotfix/2026.0-main" ]

jobs:
  build:
    # Skip workflow for WIP pull requests (draft PRs or titles with WIP indicators)
    # Patterns: draft PRs, "wip:", "[wip]", "wip ", " wip ", " wip", "work in progress" (case insensitive)
    if: |
      github.event_name == 'push' || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.title, 'wip:') &&
        !contains(github.event.pull_request.title, 'WIP:')
      )

    # Build the pinned ImageMagick and libheif versions below for AVIF animation support.
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    services:
      mariadb:
        image: mariadb:latest
        ports:
          - 33006:3306
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: webjetcms_web
        options: >-
          --health-cmd="healthcheck.sh --connect"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    #- name: Update .npmrc with NPM registry
    #  run: |
    #    echo "@datatables.net:registry=https://npm.datatables.net/" >> src/main/webapp/admin/v9/.npmrc
    #    echo "//npm.datatables.net/:_authToken=${{ secrets.NPM_AUTH_TOKEN }}" >> src/main/webapp/admin/v9/.npmrc

    - name: Install MariaDB client and image build dependencies
      run: |
        sudo apt-get update
        # AOM's CMake package also imports its tools and YUV/WebM link dependencies.
        sudo apt-get install -y --no-install-recommends \
          mariadb-client build-essential cmake pkg-config curl ca-certificates xz-utils \
          libaom-dev aom-tools libyuv-dev libwebm-dev \
          libjpeg-dev libpng-dev libwebp-dev libtiff-dev libxml2-dev liblcms2-dev librsvg2-dev

    - name: Build ImageMagick 7.1.2-34 with libheif 1.23.6
      run: |
        image_prefix="$RUNNER_TEMP/imagemagick"
        mkdir -p "$RUNNER_TEMP/imagemagick-source"
        cd "$RUNNER_TEMP/imagemagick-source"
        curl --fail --location --retry 3 -o libheif.tar.gz https://github.com/strukturag/libheif/releases/download/v1.23.6/libheif-1.23.6.tar.gz
        curl --fail --location --retry 3 -o ImageMagick.tar.xz https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-34/ImageMagick-7.1.2-34.tar.xz
        echo '4484346dc5995319dbc11e3a1c35d0a2ec46511ce370900869337fd2c7033125  libheif.tar.gz' | sha256sum --check
        echo '55fe0ec246245b46c429f9e6bc65294ad4a78a66b88abd9817971ca157856323  ImageMagick.tar.xz' | sha256sum --check
        tar -xzf libheif.tar.gz
        tar -xJf ImageMagick.tar.xz

        # Link the AV1 encoder and decoder into libheif instead of relying on runtime codec plugins.
        cmake -S libheif-1.23.6 -B libheif-build \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$image_prefix" -DCMAKE_INSTALL_LIBDIR=lib \
          -DENABLE_PLUGIN_LOADING=OFF -DWITH_AOM_DECODER=ON -DWITH_AOM_ENCODER=ON \
          -DWITH_EXAMPLES=OFF -DWITH_GDK_PIXBUF=OFF -DBUILD_TESTING=OFF -DBUILD_DOCUMENTATION=OFF
        cmake --build libheif-build --parallel "$(nproc)"
        cmake --install libheif-build

        # Select the pinned libheif during configuration and keep it selected at runtime.
        export PKG_CONFIG_PATH="$image_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
        export LDFLAGS="-Wl,-rpath,$image_prefix/lib"
        cd ImageMagick-7.1.2-34
        ./configure --prefix="$image_prefix" --disable-static --disable-docs --without-perl --without-x \
          --with-heic=yes --with-jpeg=yes --with-png=yes --with-webp=yes --with-rsvg=yes
        make -j"$(nproc)"
        make install

        "$image_prefix/bin/magick" -version
        "$image_prefix/bin/magick" -list format | awk '$1 == "AVIF" { print; found = ($2 ~ /^rw/ || $3 ~ /^rw/) } END { exit !found }'
        heif_version=$("$image_prefix/bin/magick" -list format | awk '$1 == "AVIF" { gsub(/[()]/, "", $NF); print $NF }')
        dpkg --compare-versions "$heif_version" ge 1.22.0

    - name: Import SQL file
      run: |
        mariadb -h 127.0.0.1 -P 33006 -u root -proot_password webjetcms_web < .github/workflows/blank_web_autotest.sql

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      env:
        # Require native image tests instead of silently skipping them when the codec is missing.
        AVIF_TEST_IMAGEMAGICK_DIR: ${{ runner.temp }}/imagemagick/bin
        CODECEPT_DEFAULT_PASSWORD: ${{ secrets.CODECEPT_DEFAULT_PASSWORD }}
        CODECEPT_DEFAULT_AUTH_TOKEN: ${{ secrets.CODECEPT_DEFAULT_AUTH_TOKEN }}
        CODECEPT_DEFAULT_DOMAIN_NAME: ${{ vars.CODECEPT_DEFAULT_DOMAIN_NAME }}
        DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
        GPR_USER: ${{ secrets.GPR_USER }}
        GPR_API_KEY: ${{ secrets.GPR_API_KEY }}
      run: |
        webjetDbPassword=root_password webjetDbUrl=jdbc:mysql://127.0.0.1:33006/webjetcms_web webjetDbUserName=root ./gradlew cleanTest test

  dependency-submission:
    # Skip workflow for WIP pull requests (same logic as build job)
    if: |
      github.event_name == 'push' || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.title, 'wip:') &&
        !contains(github.event.pull_request.title, 'WIP:')
      )

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      env:
        GPR_USER: ${{ secrets.GPR_USER }}
        GPR_API_KEY: ${{ secrets.GPR_API_KEY }}
      uses: gradle/actions/dependency-submission@v5

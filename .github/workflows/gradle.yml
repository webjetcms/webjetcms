# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main", "hotfix/2026.0-main" ]
  pull_request:
    branches: [ "main", "hotfix/2026.0-main" ]

jobs:
  build:
    # Skip workflow for WIP pull requests (draft PRs or titles with WIP indicators)
    # Patterns: draft PRs, "wip:", "[wip]", "wip ", " wip ", " wip", "work in progress" (case insensitive)
    if: |
      github.event_name == 'push' || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.title, 'wip:') &&
        !contains(github.event.pull_request.title, 'WIP:')
      )

    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mariadb:
        image: mariadb:latest
        ports:
          - 33006:3306
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: webjetcms_web
        options: >-
          --health-cmd="healthcheck.sh --connect"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    #- name: Update .npmrc with NPM registry
    #  run: |
    #    echo "@datatables.net:registry=https://npm.datatables.net/" >> src/main/webapp/admin/v9/.npmrc
    #    echo "//npm.datatables.net/:_authToken=${{ secrets.NPM_AUTH_TOKEN }}" >> src/main/webapp/admin/v9/.npmrc

    - name: Install MariaDB Client
      run: sudo apt-get update && sudo apt-get install -y mariadb-client

    - name: Import SQL file
      run: |
        mariadb -h 127.0.0.1 -P 33006 -u root -proot_password webjetcms_web < .github/workflows/blank_web_autotest.sql

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      env:
        CODECEPT_DEFAULT_PASSWORD: ${{ secrets.CODECEPT_DEFAULT_PASSWORD }}
        CODECEPT_DEFAULT_AUTH_TOKEN: ${{ secrets.CODECEPT_DEFAULT_AUTH_TOKEN }}
        CODECEPT_DEFAULT_DOMAIN_NAME: ${{ vars.CODECEPT_DEFAULT_DOMAIN_NAME }}
        DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
      run: |
        webjetDbPassword=root_password webjetDbUrl=jdbc:mysql://127.0.0.1:33006/webjetcms_web webjetDbUserName=root ./gradlew cleanTest test

    - name: Build and verify deployable WAR
      run: ./gradlew generateCertificate verifyBootWar

    - name: Smoke test WAR on external Tomcat 11
      shell: bash
      timeout-minutes: 15
      run: |
        set -euo pipefail

        tomcat_container="webjetcms-external-tomcat"

        show_tomcat_logs() {
          docker logs --tail 500 "${tomcat_container}" 2>&1 || true
        }

        cleanup_tomcat() {
          docker rm --force "${tomcat_container}" >/dev/null 2>&1 || true
        }

        trap cleanup_tomcat EXIT
        cleanup_tomcat

        docker run --detach \
          --name "${tomcat_container}" \
          --add-host host.docker.internal:host-gateway \
          --publish 18080:8080 \
          --env webjetDbUrl=jdbc:mariadb://host.docker.internal:33006/webjetcms_web \
          --env webjetDbUserName=root \
          --env webjetDbPassword=root_password \
          --env WEBJET_KEYSTORE_PATH=file:/usr/local/tomcat/conf/webjet-https-keystore.p12 \
          --env WEBJET_HTTPS_KEYSTORE_PASSWORD=changeit \
          --mount type=bind,source="${GITHUB_WORKSPACE}/build/certificates/https-keystore.p12",target=/usr/local/tomcat/conf/webjet-https-keystore.p12,readonly \
          --mount type=bind,source="${GITHUB_WORKSPACE}/build/libs/webjetcms.war",target=/usr/local/tomcat/webapps/ROOT.war,readonly \
          tomcat:11.0.23-jdk17-temurin-noble

        deployment_ready=false
        for attempt in $(seq 1 90); do
          tomcat_logs="$(docker logs "${tomcat_container}" 2>&1)"

          if grep -Eq "Failed to register .*Possibly already registered|LifecycleException|Error starting child" <<<"${tomcat_logs}"; then
            show_tomcat_logs
            exit 1
          fi

          if grep -q "WebJET bootstrap mode: setup" <<<"${tomcat_logs}"; then
            echo "External WAR started in setup mode; servlet registrations were not exercised."
            show_tomcat_logs
            exit 1
          fi

          http_status=""
          captcha_response=""
          if grep -q "WebJET bootstrap mode: production" <<<"${tomcat_logs}"; then
            http_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 1 --max-time 3 http://127.0.0.1:18080/admin/ || true)"
            captcha_response="$(curl --silent --output /dev/null --write-out '%{http_code}|%{content_type}' \
              --connect-timeout 1 --max-time 3 http://127.0.0.1:18080/captcha.jpg || true)"
          fi
          if grep -q "WebJET bootstrap mode: production" <<<"${tomcat_logs}" \
              && [[ "${http_status}" =~ ^(2[0-9][0-9]|3[0-9][0-9]|401|403)$ ]] \
              && [[ "${captcha_response}" == "200|image/jpeg"* ]]; then
            deployment_ready=true
            break
          fi

          if [[ "$(docker inspect --format '{{.State.Running}}' "${tomcat_container}")" != "true" ]]; then
            show_tomcat_logs
            exit 1
          fi

          sleep 5
        done

        if [[ "${deployment_ready}" != "true" ]]; then
          echo "External Tomcat did not start the production WAR within the smoke-test timeout."
          show_tomcat_logs
          exit 1
        fi

        echo "Production WAR started successfully on external Tomcat 11 " \
          "(/admin/ HTTP ${http_status}, /captcha.jpg ${captcha_response})."

  dependency-submission:
    # Skip workflow for WIP pull requests (same logic as build job)
    if: |
      github.event_name == 'push' || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.title, 'wip:') &&
        !contains(github.event.pull_request.title, 'WIP:')
      )

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v5

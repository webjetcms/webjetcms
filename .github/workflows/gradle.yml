# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main", "hotfix/2026.0-main" ]
  pull_request:
    branches: [ "main", "hotfix/2026.0-main" ]

jobs:
  build:
    # Skip workflow for WIP pull requests (draft PRs or titles with WIP indicators)
    # Patterns: draft PRs, "wip:", "[wip]", "wip ", " wip ", " wip", "work in progress" (case insensitive)
    if: |
      github.event_name == 'push' || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.title, 'wip:') &&
        !contains(github.event.pull_request.title, 'WIP:')
      )

    # Use the pinned ImageMagick bundle below for AVIF timing and browser compatibility.
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    services:
      mariadb:
        image: mariadb:latest
        ports:
          - 33006:3306
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: webjetcms_web
        options: >-
          --health-cmd="healthcheck.sh --connect"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    #- name: Update .npmrc with NPM registry
    #  run: |
    #    echo "@datatables.net:registry=https://npm.datatables.net/" >> src/main/webapp/admin/v9/.npmrc
    #    echo "//npm.datatables.net/:_authToken=${{ secrets.NPM_AUTH_TOKEN }}" >> src/main/webapp/admin/v9/.npmrc

    - name: Install MariaDB client
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends mariadb-client

    - name: Install ImageMagick 7.1.2-34 with bundled AVIF codecs
      run: |
        mkdir -p "$RUNNER_TEMP/imagemagick"
        cd "$RUNNER_TEMP/imagemagick"
        curl --fail --location --retry 3 -o ImageMagick.AppImage https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-34/ImageMagick-7.1.2-34-gcc-x86_64.AppImage
        echo '6e9edfd35d5f30b57c27533afe003d6085faaf8607b207426f398d11751acf93  ImageMagick.AppImage' | sha256sum --check
        chmod +x ImageMagick.AppImage
        ./ImageMagick.AppImage --appimage-extract > /dev/null
        ln -s squashfs-root/AppRun magick
        for command in identify composite convert; do
          printf '#!/bin/sh\nexec "%s/magick" %s "$@"\n' "$PWD" "$command" > "$command"
          chmod +x "$command"
        done
        ./magick -version
        ./magick -list format | awk '$1 == "AVIF" { print; found = 1 } END { exit !found }'
        heif_version=$(./magick -list format | awk '$1 == "AVIF" { gsub(/[()]/, "", $NF); print $NF }')
        dpkg --compare-versions "$heif_version" ge 1.22.0

    - name: Import SQL file
      run: |
        mariadb -h 127.0.0.1 -P 33006 -u root -proot_password webjetcms_web < .github/workflows/blank_web_autotest.sql

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      env:
        # Require native image tests instead of silently skipping them when the codec is missing.
        AVIF_TEST_IMAGEMAGICK_DIR: ${{ runner.temp }}/imagemagick
        CODECEPT_DEFAULT_PASSWORD: ${{ secrets.CODECEPT_DEFAULT_PASSWORD }}
        CODECEPT_DEFAULT_AUTH_TOKEN: ${{ secrets.CODECEPT_DEFAULT_AUTH_TOKEN }}
        CODECEPT_DEFAULT_DOMAIN_NAME: ${{ vars.CODECEPT_DEFAULT_DOMAIN_NAME }}
        DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
        GPR_USER: ${{ secrets.GPR_USER }}
        GPR_API_KEY: ${{ secrets.GPR_API_KEY }}
      run: |
        webjetDbPassword=root_password webjetDbUrl=jdbc:mysql://127.0.0.1:33006/webjetcms_web webjetDbUserName=root ./gradlew cleanTest test

  dependency-submission:
    # Skip workflow for WIP pull requests (same logic as build job)
    if: |
      github.event_name == 'push' || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.title, 'wip:') &&
        !contains(github.event.pull_request.title, 'WIP:')
      )

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      env:
        GPR_USER: ${{ secrets.GPR_USER }}
        GPR_API_KEY: ${{ secrets.GPR_API_KEY }}
      uses: gradle/actions/dependency-submission@v5

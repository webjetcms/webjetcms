    // for bootWar, so the external-container plain WAR does not need the marker jar.
    classpath = classpath.filter { dependency ->
        dependency.name.startsWith('spring-boot-starter-tomcat-') == false
    }
}

tasks.register('prepareAntWar', Sync) {
    group = 'build'
    description = 'Builds the plain WAR and prepares provided dependencies for the legacy Ant compiler'
    dependsOn tasks.named('war')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from configurations.providedRuntime
    into layout.buildDirectory.dir('ant-provided-runtime')
}


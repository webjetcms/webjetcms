// Generate self-signed certificate for HTTPS (migrated from gretty's auto-generated keystore)
// Gretty auto-generated build/gretty/https-keystore.p12; now writes to the build directory via keytool
task generateCertificate(type: Exec) {
    group = 'build'
    description = 'Generates self-signed certificate for embedded Tomcat HTTPS'
    def certFile = file("${projectDir}/build/certificates/https-keystore.p12")
    def certDir = certFile.parentFile
    onlyIf { !certFile.exists() }
    doFirst {
        certDir.mkdirs()
    }
    workingDir projectDir
    // macOS: keytool, Linux: keytool (from JDK)
    def keytool = 'keytool'
    commandLine keytool,
        '-genkeypair',
        '-alias', 'tomcat',
        '-keyalg', 'EC',
        '-groupname', 'secp256r1',
        '-keystore', certFile.absolutePath,
        '-storetype', 'PKCS12',
        '-storepass' , System.getenv('WEBJET_HTTPS_KEYSTORE_PASSWORD') ?: 'changeit',
        '-keypass' , System.getenv('WEBJET_HTTPS_KEYSTORE_PASSWORD') ?: 'changeit',
        '-validity', '365',
        '-sigalg', 'SHA256withECDSA',
        '-dname', 'CN=WebJET CMS, OU=Development, O=InterWay, L=Bratislava, C=SK',
        '-ext', 'SAN=DNS:localhost,IP:127.0.0.1'
}

// Ensure certificate is generated before bootRun
bootRun.dependsOn generateCertificate

tasks.register('verifyBootWar') {
    group = 'verification'
    description = 'Verifies the embedded and external-Tomcat WAR packaging contracts'

    def bootWarTask = tasks.named('bootWar')
    def bootWarArchive = bootWarTask.flatMap { it.archiveFile }
    def plainWarTask = tasks.named('war')
    def plainWarArchive = plainWarTask.flatMap { it.archiveFile }
    dependsOn bootWarTask, plainWarTask
    inputs.file(bootWarArchive)
    inputs.file(plainWarArchive)

    doLast {
        def archive = new java.util.zip.ZipFile(bootWarArchive.get().asFile)
        try {
            List<String> entries = archive.entries().collect { it.name }
            Set<String> entryNames = entries as Set
            if (entries.size() != entryNames.size()) {
                Set<String> uniqueEntries = []
                Set<String> duplicateEntries = entries.findAll { entry -> uniqueEntries.add(entry) == false }
                throw new GradleException("The boot WAR contains duplicate entries: ${duplicateEntries.sort()}")
            }

            Set<String> requiredEntries = [
                'META-INF/MANIFEST.MF',
                'WEB-INF/web.xml',
                'WEB-INF/web-v2023.xml',
                'WEB-INF/classes/sk/iway/iwcm/system/spring/SpringBootStarter.class'
            ]
            Set<String> missingEntries = requiredEntries - entryNames
            if (missingEntries.isEmpty() == false) {
                throw new GradleException("The boot WAR is incomplete; missing entries: ${missingEntries.sort()}")
            }
            if (entryNames.contains('WEB-INF/classes/certificates/https-keystore.p12')) {
                throw new GradleException("The boot WAR must not contain the generated development private key")
            }

            List<String> requiredProvidedJars = [
                'ecj-',
                'jakarta.annotation-api-',
                'jakarta.el-api-',
                'jakarta.servlet-api-',
                'jakarta.servlet.jsp-api-',
                'spring-boot-tomcat-',
                'spring-boot-web-server-',
                'tomcat-embed-core-',
                'tomcat-embed-el-',
                'tomcat-embed-jasper-',
                'tomcat-embed-websocket-'
            ]
            requiredProvidedJars.each { jarPrefix ->
                List<String> matches = entries.findAll { entry ->
                    entry.startsWith("WEB-INF/lib-provided/${jarPrefix}") && entry.endsWith('.jar')
                }
                if (matches.size() != 1) {
                    throw new GradleException(
                        "The boot WAR must contain exactly one provided ${jarPrefix} jar: ${matches.sort()}"
                    )
                }
            }

            Set<String> packagedTomcatVersions = embeddedTomcatModules.collect { moduleName ->
                String artifactName = moduleName.tokenize(':').last()
                String prefix = "WEB-INF/lib-provided/${artifactName}-"
                String entry = entries.find { candidate ->
                    candidate.startsWith(prefix) && candidate.endsWith('.jar')
                }
                entry.substring(prefix.length(), entry.length() - '.jar'.length())
            } as Set
            if (packagedTomcatVersions.size() != 1) {
                throw new GradleException(
                    "The boot WAR contains misaligned Tomcat versions: ${packagedTomcatVersions.sort()}"
                )
            }

            def parseNumericVersion = { String version ->
                List<String> parts = version.tokenize('.')
                if (parts.size() != 3 || parts.any { part -> (part ==~ /\d+/) == false }) {
                    throw new GradleException("Cannot compare non-numeric Tomcat version: ${version}")
                }
                parts.collect { part -> part.toInteger() }
            }
            def compareVersions = { String left, String right ->
                List<Integer> leftParts = parseNumericVersion(left)
                List<Integer> rightParts = parseNumericVersion(right)
                int comparison = 0
                for (int index = 0; index < leftParts.size(); index++) {
                    comparison = leftParts[index] <=> rightParts[index]
                    if (comparison != 0) break
                }
                comparison
            }
            String packagedTomcatVersion = packagedTomcatVersions.first()
            if (compareVersions(packagedTomcatVersion, tomcatMinimumVersion) < 0) {
                throw new GradleException(
                    "The boot WAR contains Tomcat ${packagedTomcatVersion}, below security floor ${tomcatMinimumVersion}"
                )
            }

            List<String> duplicateAnnotationApis = entries.findAll { entry ->
                entry ==~ /^WEB-INF\/lib-provided\/tomcat-annotations-api-.+\.jar$/
            }
            if (duplicateAnnotationApis.isEmpty() == false) {
                throw new GradleException(
                    "The boot WAR must use jakarta.annotation-api instead of Tomcat's duplicate API: " +
                    duplicateAnnotationApis.sort()
                )
            }

            if (entryNames.any { entry ->
                entry ==~ /^WEB-INF\/lib\/spring-boot-[0-9].+\.jar$/
            } == false) {
                throw new GradleException("The boot WAR is missing Spring Boot application libraries")
            }

            List<String> containerJarsInApplicationClasspath = entries.findAll { entry ->
                entry ==~ /^WEB-INF\/lib\/(ecj|jakarta\.annotation-api|jakarta\.el-api|jakarta\.servlet-api|jakarta\.servlet\.jsp-api|spring-boot-tomcat|spring-boot-web-server|tomcat-annotations-api|tomcat-embed-.+)-.+\.jar$/
            }
            if (containerJarsInApplicationClasspath.isEmpty() == false) {
                throw new GradleException(
                    "Tomcat implementation jars must only be in WEB-INF/lib-provided: " +
                    containerJarsInApplicationClasspath.sort()
                )
            }

            [
                'WEB-INF/web.xml': file('src/main/webapp/WEB-INF/web.xml'),
                'WEB-INF/web-v2023.xml': file('src/main/webapp/WEB-INF/web-v2023.xml')
            ].each { archivePath, sourceDescriptor ->
                byte[] packagedDescriptor = archive.getInputStream(archive.getEntry(archivePath)).bytes
                if (java.util.Arrays.equals(packagedDescriptor, sourceDescriptor.bytes) == false) {
                    throw new GradleException("The boot WAR contains an unexpected ${archivePath} descriptor")
                }
            }
        } finally {
            archive.close()
        }

        def plainArchive = new java.util.zip.ZipFile(plainWarArchive.get().asFile)
        try {
            List<String> plainEntries = plainArchive.entries().collect { it.name }
            Set<String> requiredPlainEntries = [
                'WEB-INF/web.xml',
                'WEB-INF/classes/sk/iway/iwcm/system/spring/SpringBootStarter.class'
            ]
            Set<String> missingPlainEntries = requiredPlainEntries - (plainEntries as Set)
            if (missingPlainEntries.isEmpty() == false) {
                throw new GradleException("The plain WAR is incomplete; missing entries: ${missingPlainEntries.sort()}")
            }

            List<String> externalContainerJars = plainEntries.findAll { entry ->
                entry ==~ /^WEB-INF\/lib\/(ecj|jakarta\.annotation-api|jakarta\.el-api|jakarta\.servlet-api|jakarta\.servlet\.jsp-api|spring-boot-starter-tomcat|spring-boot-tomcat|tomcat-annotations-api|tomcat-embed-.+)-.+\.jar$/
            }
            if (externalContainerJars.isEmpty() == false) {
                throw new GradleException(
                    "The plain WAR must obtain container implementation and APIs from external Tomcat: " +
                    externalContainerJars.sort()
                )
            }
        } finally {
            plainArchive.close()
        }
    }
}


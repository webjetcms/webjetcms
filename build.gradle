    ]
]

def pomDependencyCoordinate = { Node dependency ->
    "${dependency.get('groupId').first().text().trim()}:" +
        dependency.get('artifactId').first().text().trim()
}
def ensurePomDependencyExclusion = { Node dependency, String excludedCoordinate ->
    List<String> excludedParts = excludedCoordinate.tokenize(':')
    NodeList exclusionContainers = dependency.get('exclusions')
    Node exclusions = exclusionContainers.isEmpty() ? dependency.appendNode('exclusions') : exclusionContainers.first()
    boolean alreadyExcluded = exclusions.get('exclusion').any { Node exclusion ->
        pomDependencyCoordinate(exclusion) == excludedCoordinate
    }
    if (alreadyExcluded == false) {
        Node exclusion = exclusions.appendNode('exclusion')
        exclusion.appendNode('groupId', excludedParts.first())
        exclusion.appendNode('artifactId', excludedParts.last())
    }
}


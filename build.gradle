publishing {
    publications {
        maven(MavenPublication) {
            groupId = System.getProperty("wjgroup")
            artifactId = System.getProperty("wjname")
            version = System.getProperty("wjversion")

            pom {
                // Ant publishes the primary WebJET artifact as a JAR. Without this explicit
                // value Gradle's WAR project emits packaging=pom and Maven deploy-file stores
                // the binary under a .pom extension.
                packaging = 'jar'
                name = 'webjet'
                description = 'WebJET CMS - Web Content Management in Java/Spring'
                url = 'https://www.webjetcms.com'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        name = 'Lubos Balat'
                        email = 'info@webjet.eu'
                        organization = 'InterWay, a. s.'
                        organizationUrl = 'https://www.interway.sk'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/webjetcms/webjetcms.git'
                    developerConnection = 'scm:git:ssh://github.com:/webjetcms/webjetcms.git'
                    url = 'https://github.com/webjetcms/webjetcms/tree/master'
                }

                // The Gradle War component maps provided dependencies to Maven runtime.
                // Publish the external-container contract explicitly: container APIs and
                // the embedded runtime are provided, while WebMVC must not reintroduce
                // spring-boot-starter-tomcat through its transitive dependency graph.
                withXml {
                    Node pomNode = asNode()
                    NodeList dependencyContainers = pomNode.get('dependencies')
                    if (dependencyContainers.isEmpty() == false) {
                        dependencyContainers.first().get('dependency').each { Node dependency ->
                            String coordinate = pomDependencyCoordinate(dependency)
                            if (externalTomcatProvidedDependencies.contains(coordinate)) {
                                NodeList scopeNodes = dependency.get('scope')
                                Node scope = scopeNodes.isEmpty() ? dependency.appendNode('scope') : scopeNodes.first()
                                scope.value = 'provided'
                            }
                            externalTomcatDependencyExclusions[coordinate]?.each { excludedCoordinate ->
                                ensurePomDependencyExclusion(dependency, excludedCoordinate)
                            }
                        }
                    }
                }
            }

            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
        }
    }
}

// The Java component metadata describes the internal executable-WAR graph, while the
// released artifact intentionally exposes the external-Tomcat POM contract above. Do not
// publish a divergent .module file that Gradle consumers would prefer over the Maven POM.
tasks.withType(org.gradle.api.publish.tasks.GenerateModuleMetadata).configureEach {
    enabled = false
}

//vygeneruje POM subor pre maven deployment
task writePom() {

    dependsOn tasks.withType(GenerateMavenPom)

    doLast {
        //generate pom file
        def wjversion = System.getProperty("wjversion");
        if (wjversion == null) wjversion = "unknown"

        /*pom {
            project {
                groupId 'sk.iway'
                artifactId 'webjet'
                version wjversion
                name 'webjet'
            }
        }.writeTo("build/pom.xml")*/

        // Gradle versionMapping has already written the resolved runtime versions.
        Node xml = new XmlParser().parse("build/publications/maven/pom-default.xml")

        // Apply only the legacy WebJET scope and filtering rules. Dependency versions and
        // exclusions must stay identical to the Gradle-resolved publication model.
        Node dependencies = xml.dependencies.first();
        Iterator<Node> i = dependencies.iterator();
        while (i.hasNext()) {
            Node dependency = i.next()
            Node artifactId = dependency.get("artifactId").first()
            def groupId = dependency.get("groupId").first().value().first()
            def artifactName = artifactId.value().first()
            NodeList versionNodes = dependency.get("version")
            if (versionNodes.isEmpty()) {
                throw new GradleException("Generated POM dependency ${groupId}:${artifactName} has no resolved version")
            }
            def version = versionNodes.first().value().first()
            String coordinate = "${groupId}:${artifactName}".toString()

            // Temporarily omit exclusions from the legacy POM to simplify migration comparisons.
            /*dependency.get('exclusions').toList().each { Node exclusionContainer ->
                dependency.remove(exclusionContainer)
            }*/
            // These exclusions are part of the external-Tomcat publication contract and
            // must also be present while the temporary comparison mode above is enabled.
            externalTomcatDependencyExclusions[coordinate]?.each { excludedCoordinate ->
                ensurePomDependencyExclusion(dependency, excludedCoordinate)
            }

            //zmen scope z runtime na compile
            Node scope = dependency.get("scope").first()
            def scopeValue = scope.value().first()
            //println "groupId: "+groupId+" artifactId:"+artifactName+" version="+version+" scope="+scopeValue
            if (externalTomcatProvidedDependencies.contains(coordinate)) scope.value = "provided";
            else if ("runtime".equals(scopeValue)) scope.value = "compile";

            if (artifactName.endsWith("servlet-api") || artifactName.endsWith(".jsp-api") || artifactName.endsWith(".el-api") || "jsr250-api".equals(artifactName)) scope.value = "provided";

            // Remove dependencies already bundled in the legacy WebJET artifacts. Evaluate
            // the rules first so a dependency matching more than one rule is removed once.
            boolean removeLegacyDependency = "test".equals(scopeValue) ||
                "8.9-SNAPSHOT-wj9".equals(version) ||
                (groupId.startsWith("sk.iway") && "pd4ml".equals(artifactName) == false) ||
                "stripes".equals(artifactName)
            if (removeLegacyDependency) {
                println "----> removing: "+artifactName
                i.remove()
            }
        }

        // zapis pom subor
        File outputPom = file("build/updatezip/artifacts/webjetcms-"+wjversion+".pom")
        outputPom.parentFile.mkdirs()
        outputPom.withPrintWriter('UTF-8') { printWriter ->
            printWriter.println('<?xml version="1.0" encoding="UTF-8"?>');
            XmlNodePrinter xmlNodePrinter = new XmlNodePrinter(printWriter)
            xmlNodePrinter.with {
                preserveWhitespace = true
                expandEmptyElements = true
            }
            xmlNodePrinter.print(xml)
        }

        delete files("build/pom.xml")
    }
}

tasks.register('verifyGeneratedPom') {
    group = 'verification'
    description = 'Verifies resolved POM versions and the external-Tomcat consumer contract'
    dependsOn writePom

    doLast {
        String wjversion = System.getProperty('wjversion') ?: 'unknown'
        List<File> pomFiles = [
            file('build/publications/maven/pom-default.xml'),
            file("build/updatezip/artifacts/webjetcms-${wjversion}.pom")
        ]
        Set<String> expectedLegacyRemovals = [
            'sk.iway:wjcron4j',
            'sk.iway:wjjcaptcha',
            'sk.iway:wjdaisydiff',
            'net.sourceforge.stripes:stripes'
        ] as Set

        List<String> versionedSpringManagedDependencies = []
        ['implementation', 'providedCompile', 'providedRuntime', 'testImplementation'].each { configurationName ->
            configurations.getByName(configurationName).dependencies.each { dependency ->
                boolean springManaged = dependency.group == 'org.springframework.boot' ||
                    dependency.group == 'org.springframework.security'
                if (springManaged && dependency.name != 'spring-boot-dependencies' && dependency.version != null) {
                    versionedSpringManagedDependencies.add(
                        "${configurationName}:${dependency.group}:${dependency.name}:${dependency.version}".toString()
                    )
                }
            }
        }
        if (versionedSpringManagedDependencies.isEmpty() == false) {
            throw new GradleException(
                'Spring Boot and Spring Security dependencies managed by the Boot BOM must not declare versions: ' +
                versionedSpringManagedDependencies.sort()
            )
        }

        ['providedCompile', 'providedRuntime'].each { configurationName ->
            List<String> unresolvedDependencies = configurations.getByName(configurationName)
                .incoming.resolutionResult.allDependencies.findAll { dependency ->
                    dependency instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult
                }.collect { dependency ->
                    dependency.requested.displayName
                }.sort()
            if (unresolvedDependencies.isEmpty() == false) {
                throw new GradleException(
                    "${configurationName} contains unresolved dependencies: ${unresolvedDependencies}"
                )
            }
        }

        Map<String, String> resolvedVersions = [:]
        configurations.runtimeClasspath.incoming.resolutionResult.allComponents.each { component ->
            def identifier = component.id
            if (identifier instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                resolvedVersions["${identifier.group}:${identifier.module}"] = identifier.version
            }
        }
        if (resolvedVersions.containsKey('org.apache.tomcat:tomcat-annotations-api')) {
            throw new GradleException('runtimeClasspath contains duplicate org.apache.tomcat:tomcat-annotations-api')
        }

        ['org.aspectj:aspectjrt', 'org.aspectj:aspectjweaver'].each { coordinate ->
            String resolvedVersion = resolvedVersions[coordinate]
            if (resolvedVersion != aspectJVersion) {
                throw new GradleException(
                    "${coordinate} resolved to ${resolvedVersion}, but the shared AspectJ version is ${aspectJVersion}"
                )
            }
        }
        Set<String> agentAspectJVersions = configurations.agent.incoming.resolutionResult.allComponents.findAll { component ->
            def identifier = component.id
            identifier instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                identifier.group == 'org.aspectj' && identifier.module == 'aspectjweaver'
        }.collect { component ->
            component.id.version
        } as Set<String>
        if (agentAspectJVersions != ([aspectJVersion] as Set<String>)) {
            throw new GradleException(
                "The AspectJ Java agent must resolve to ${aspectJVersion}, found ${agentAspectJVersions.sort()}"
            )
        }
        File aspectJToolsJar = file("ant/aspectj/aspectjtools-${aspectJVersion}.jar")
        if (aspectJToolsJar.isFile() == false ||
            file('ant/compile.xml').getText('UTF-8').contains("aspectjtools-${aspectJVersion}.jar") == false) {
            throw new GradleException(
                "Ant AspectJ compiler must use ant/aspectj/aspectjtools-${aspectJVersion}.jar"
            )
        }

        def childText = { Node node, String childName ->
            NodeList children = node.get(childName)
            children.isEmpty() ? '' : children.first().text().trim()
        }
        def dependencyCoordinate = { Node dependency ->
            "${childText(dependency, 'groupId')}:${childText(dependency, 'artifactId')}".toString()
        }
        def dependencyExclusions = { Node dependency ->
            NodeList exclusionContainers = dependency.get('exclusions')
            if (exclusionContainers.isEmpty()) return []
            exclusionContainers.first().get('exclusion').collect { exclusion ->
                dependencyCoordinate(exclusion)
            }.sort()
        }
        def parseNumericVersion = { String version ->
            List<String> parts = version.tokenize('.')
            if (parts.size() != 3 || parts.any { part -> (part ==~ /\d+/) == false }) {
                throw new GradleException("Cannot compare non-numeric Tomcat version: ${version}")
            }
            parts.collect { part -> part.toInteger() }
        }
        def compareVersions = { String left, String right ->
            List<Integer> leftParts = parseNumericVersion(left)
            List<Integer> rightParts = parseNumericVersion(right)
            int comparison = 0
            for (int index = 0; index < leftParts.size(); index++) {
                comparison = leftParts[index] <=> rightParts[index]
                if (comparison != 0) break
            }
            comparison
        }
        String expectedBootBomVersion = org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
            .tokenize(':').last()
        Map<File, Map<String, Map<String, Object>>> dependencyModels = [:]

        pomFiles.each { pomFile ->
            if (pomFile.isFile() == false) {
                throw new GradleException("Generated POM does not exist: ${pomFile}")
            }

            Node pom = new XmlParser().parse(pomFile)
            String pomPackaging = childText(pom, 'packaging')
            // Maven's default for an omitted packaging element is jar. Gradle omits the
            // element when MavenPom.packaging is explicitly set to that default.
            if (pomPackaging.isBlank() == false && pomPackaging != 'jar') {
                throw new GradleException("Generated POM must declare jar packaging: ${pomFile}")
            }
            NodeList dependencyContainers = pom.get('dependencies')
            if (dependencyContainers.isEmpty()) {
                throw new GradleException("Generated POM has no dependencies: ${pomFile}")
            }
            List<Node> directDependencies = dependencyContainers.first().get('dependency') as List<Node>
            Map<String, List<Node>> directDependenciesByCoordinateList = directDependencies.groupBy { dependency ->
                dependencyCoordinate(dependency)
            }
            List<String> duplicateCoordinates = directDependenciesByCoordinateList.findAll { coordinate, dependencies ->
                dependencies.size() != 1
            }.keySet().sort()
            if (duplicateCoordinates.isEmpty() == false) {
                throw new GradleException("Generated POM contains duplicate dependencies ${duplicateCoordinates}: ${pomFile}")
            }
            Map<String, Node> directDependenciesByCoordinate = directDependencies.collectEntries { dependency ->
                [(dependencyCoordinate(dependency)): dependency]
            }

            directDependenciesByCoordinate.each { coordinate, dependency ->
                String version = childText(dependency, 'version')
                if (version.isBlank() || version.contains('+') || version.contains('${') ||
                    version.startsWith('[') || version.startsWith('(')) {
                    throw new GradleException(
                        "Generated POM contains an unresolved version for ${coordinate}: '${version}' in ${pomFile}"
                    )
                }
                String resolvedVersion = resolvedVersions[coordinate]
                if (resolvedVersion == null) {
                    throw new GradleException(
                        "Generated POM dependency ${coordinate}:${version} is absent from runtimeClasspath"
                    )
                }
                if (version != resolvedVersion) {
                    throw new GradleException(
                        "Generated POM dependency ${coordinate}:${version} differs from resolved ${resolvedVersion}"
                    )
                }
            }
            dependencyModels[pomFile] = directDependenciesByCoordinate.collectEntries { coordinate, dependency ->
                [(coordinate): [
                    version: childText(dependency, 'version'),
                    scope: childText(dependency, 'scope'),
                    exclusions: dependencyExclusions(dependency)
                ]]
            }

            NodeList managementContainers = pom.get('dependencyManagement')
            if (managementContainers.isEmpty()) {
                throw new GradleException("Generated POM has no dependencyManagement: ${pomFile}")
            }
            List<Node> managedDependencies = managementContainers.first()
                .get('dependencies').first().get('dependency') as List<Node>
            List<Node> bootBomImports = managedDependencies.findAll { dependency ->
                childText(dependency, 'groupId') == 'org.springframework.boot' &&
                    childText(dependency, 'artifactId') == 'spring-boot-dependencies' &&
                    childText(dependency, 'type') == 'pom' &&
                    childText(dependency, 'scope') == 'import'
            }
            if (bootBomImports.size() != 1 || childText(bootBomImports.first(), 'version') != expectedBootBomVersion) {
                throw new GradleException(
                    "Generated POM must import Spring Boot BOM ${expectedBootBomVersion} exactly once: ${pomFile}"
                )
            }
            if (managedDependencies.any { dependency ->
                childText(dependency, 'groupId') in ['com.fasterxml.jackson', 'tools.jackson'] &&
                    childText(dependency, 'artifactId') == 'jackson-bom' &&
                    childText(dependency, 'scope') == 'import'
            }) {
                throw new GradleException("Generated POM must not import a separate Jackson BOM: ${pomFile}")
            }

            String log4jBridgeCoordinate = 'org.apache.logging.log4j:log4j-to-slf4j'
            Node log4jBridgeDependency = directDependenciesByCoordinate[log4jBridgeCoordinate]
            String resolvedLog4jBridgeVersion = resolvedVersions[log4jBridgeCoordinate]
            if (log4jBridgeDependency == null ||
                compareVersions(resolvedLog4jBridgeVersion, log4jToSlf4jMinimumVersion) < 0) {
                throw new GradleException(
                    "Generated POM must publish ${log4jBridgeCoordinate} at security floor " +
                    "${log4jToSlf4jMinimumVersion} or newer: ${pomFile}"
                )
            }
            List<Node> managedLog4jBridgeDependencies = managedDependencies.findAll { dependency ->
                dependencyCoordinate(dependency) == log4jBridgeCoordinate
            }
            if (managedLog4jBridgeDependencies.size() != 1 ||
                childText(managedLog4jBridgeDependencies.first(), 'version') != resolvedLog4jBridgeVersion) {
                throw new GradleException(
                    "Generated POM dependencyManagement must preserve resolved ${log4jBridgeCoordinate}:" +
                    "${resolvedLog4jBridgeVersion}: ${pomFile}"
                )
            }

            String webauthnCoordinate = 'org.springframework.security:spring-security-webauthn'
            if (directDependenciesByCoordinate.containsKey(webauthnCoordinate) == false) {
                throw new GradleException("Generated POM is missing ${webauthnCoordinate}: ${pomFile}")
            }

            externalTomcatDependencyExclusions.each { coordinate, expectedExclusions ->
                Node dependency = directDependenciesByCoordinate[coordinate]
                List<String> actualExclusions = dependency == null ? [] : dependencyExclusions(dependency)
                if (dependency == null || actualExclusions.containsAll(expectedExclusions) == false) {
                    throw new GradleException(
                        "Generated POM must preserve external-Tomcat exclusions ${expectedExclusions} on " +
                        "${coordinate}: ${pomFile}"
                    )
                }
            }

            externalTomcatProvidedDependencies.each { coordinate ->
                Node dependency = directDependenciesByCoordinate[coordinate]
                if (dependency == null || childText(dependency, 'scope') != 'provided') {
                    throw new GradleException(
                        "Generated POM must publish external-container dependency ${coordinate} as provided: ${pomFile}"
                    )
                }
            }

            Set<String> directEmbeddedTomcatDependencies = directDependenciesByCoordinate.keySet().findAll { coordinate ->
                coordinate.startsWith('org.apache.tomcat.embed:')
            } as Set<String>
            Set<String> expectedDirectEmbeddedTomcatDependencies = [
                'org.apache.tomcat.embed:tomcat-embed-jasper'
            ] as Set<String>
            if (directEmbeddedTomcatDependencies != expectedDirectEmbeddedTomcatDependencies) {
                throw new GradleException(
                    "Generated POM contains unexpected direct embedded Tomcat dependencies " +
                    "${directEmbeddedTomcatDependencies.sort()}; expected only Jasper: ${pomFile}"
                )
            }

            Node jasperDependency = directDependenciesByCoordinate['org.apache.tomcat.embed:tomcat-embed-jasper']
            if (pomFile == pomFiles.first() &&
                dependencyExclusions(jasperDependency).contains('org.apache.tomcat:tomcat-annotations-api') == false) {
                throw new GradleException(
                    "Standard POM Jasper dependency lost the duplicate annotations API exclusion: ${pomFile}"
                )
            }

            Map<String, String> resolvedTomcatVersions = embeddedTomcatModules.collectEntries { coordinate ->
                [(coordinate): resolvedVersions[coordinate]]
            }
            if (resolvedTomcatVersions.values().any { version -> version == null }) {
                throw new GradleException("runtimeClasspath is missing a Tomcat module: ${resolvedTomcatVersions}")
            }
            Set<String> selectedTomcatVersions = resolvedTomcatVersions.values() as Set<String>
            if (selectedTomcatVersions.size() != 1) {
                throw new GradleException(
                    "runtimeClasspath contains misaligned Tomcat versions ${resolvedTomcatVersions}: ${pomFile}"
                )
            }
            String selectedTomcatVersion = selectedTomcatVersions.first()
            if (compareVersions(selectedTomcatVersion, tomcatMinimumVersion) < 0) {
                throw new GradleException(
                    "runtimeClasspath contains Tomcat ${selectedTomcatVersion}, below security floor " +
                    "${tomcatMinimumVersion}: ${pomFile}"
                )
            }
            embeddedTomcatModules.each { coordinate ->
                List<Node> managedTomcatDependencies = managedDependencies.findAll { dependency ->
                    dependencyCoordinate(dependency) == coordinate
                }
                if (managedTomcatDependencies.size() != 1 ||
                    childText(managedTomcatDependencies.first(), 'version') != resolvedTomcatVersions[coordinate]) {
                    throw new GradleException(
                        "Generated POM dependencyManagement must align ${coordinate} to " +
                        "${resolvedTomcatVersions[coordinate]}: ${pomFile}"
                    )
                }
            }
            if (directDependenciesByCoordinate.containsKey('org.apache.tomcat:tomcat-annotations-api')) {
                throw new GradleException("Generated POM contains duplicate Tomcat annotations API: ${pomFile}")
            }
        }

        Map<String, Map<String, Object>> standardDependencies = dependencyModels[pomFiles.first()]
        Map<String, Map<String, Object>> legacyDependencies = dependencyModels[pomFiles.last()]
        Set<String> removedFromLegacy = (standardDependencies.keySet() - legacyDependencies.keySet()) as Set
        Set<String> addedToLegacy = (legacyDependencies.keySet() - standardDependencies.keySet()) as Set
        if (removedFromLegacy != expectedLegacyRemovals || addedToLegacy.isEmpty() == false) {
            throw new GradleException(
                "Legacy POM dependency filtering changed; removed=${removedFromLegacy.sort()}, " +
                "added=${addedToLegacy.sort()}, expected removals=${expectedLegacyRemovals.sort()}"
            )
        }

        legacyDependencies.each { coordinate, legacyDependency ->
            Map<String, Object> standardDependency = standardDependencies[coordinate]
            if (legacyDependency.version != standardDependency.version) {
                throw new GradleException(
                    "Legacy POM changed ${coordinate} version ${standardDependency.version} to ${legacyDependency.version}"
                )
            }
            if (legacyDependency.exclusions != standardDependency.exclusions) {
                throw new GradleException(
                    "Legacy POM changed ${coordinate} exclusions ${standardDependency.exclusions} to ${legacyDependency.exclusions}"
                )
            }

            String artifactName = coordinate.tokenize(':').last()
            String expectedLegacyScope = standardDependency.scope == 'runtime' ? 'compile' : standardDependency.scope
            if (artifactName.endsWith('servlet-api') || artifactName.endsWith('.jsp-api') ||
                artifactName.endsWith('.el-api') || artifactName == 'jsr250-api') {
                expectedLegacyScope = 'provided'
            }
            if (legacyDependency.scope != expectedLegacyScope) {
                throw new GradleException(
                    "Legacy POM changed ${coordinate} scope ${standardDependency.scope} to ${legacyDependency.scope}; " +
                    "expected ${expectedLegacyScope}"
                )
            }
        }

        // Resolve the final POM as a dependency of a separate Gradle consumer. This tests
        // Maven-POM scope and exclusion semantics, rather than the project's internal graph
        // where embedded Tomcat is intentionally present for bootRun and bootWar.
        String fixtureGroup = 'com.webjetcms.pomverification'
        String fixtureArtifact = 'webjetcms-external-tomcat'
        String fixtureVersion = '1.0.0'
        File fixtureRepository = layout.buildDirectory.dir('tmp/generated-pom-consumer/repository').get().asFile
        File fixtureModuleDirectory = new File(
            fixtureRepository,
            "${fixtureGroup.replace('.', '/')}/${fixtureArtifact}/${fixtureVersion}"
        )
        delete fixtureModuleDirectory
        fixtureModuleDirectory.mkdirs()

        Node fixturePom = new XmlParser().parse(pomFiles.last())
        fixturePom.get('groupId').first().value = fixtureGroup
        fixturePom.get('artifactId').first().value = fixtureArtifact
        fixturePom.get('version').first().value = fixtureVersion
        File fixturePomFile = new File(fixtureModuleDirectory, "${fixtureArtifact}-${fixtureVersion}.pom")
        fixturePomFile.withPrintWriter('UTF-8') { printWriter ->
            printWriter.println('<?xml version="1.0" encoding="UTF-8"?>')
            XmlNodePrinter printer = new XmlNodePrinter(printWriter)
            printer.preserveWhitespace = true
            printer.expandEmptyElements = true
            printer.print(fixturePom)
        }
        File fixtureJar = new File(fixtureModuleDirectory, "${fixtureArtifact}-${fixtureVersion}.jar")
        new java.util.jar.JarOutputStream(new FileOutputStream(fixtureJar)).close()

        def fixtureDependency = dependencies.create("${fixtureGroup}:${fixtureArtifact}:${fixtureVersion}")
        fixtureDependency.changing = true
        Configuration consumerRuntime = configurations.detachedConfiguration(fixtureDependency)
        consumerRuntime.transitive = true
        consumerRuntime.resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
        List<String> unresolvedConsumerDependencies = consumerRuntime.incoming.resolutionResult.allDependencies
            .findAll { dependency ->
                dependency instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult
            }.collect { dependency ->
                dependency.requested.displayName
            }.sort()
        if (unresolvedConsumerDependencies.isEmpty() == false) {
            throw new GradleException(
                "Generated POM consumer contains unresolved dependencies: ${unresolvedConsumerDependencies}"
            )
        }
        Set<String> consumerModules = consumerRuntime.incoming.resolutionResult.allComponents.collect { component ->
            def identifier = component.id
            identifier instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier ?
                "${identifier.group}:${identifier.module}".toString() : null
        }.findAll { coordinate -> coordinate != null } as Set<String>
        Set<String> forbiddenConsumerTomcatModules = consumerModules.findAll { coordinate ->
            coordinate.startsWith('org.apache.tomcat.embed:') ||
                coordinate == 'org.apache.tomcat:tomcat-annotations-api' ||
                coordinate == 'org.springframework.boot:spring-boot-tomcat' ||
                coordinate.startsWith('org.springframework.boot:spring-boot-starter-tomcat')
        } as Set<String>
        if (forbiddenConsumerTomcatModules.isEmpty() == false) {
            throw new GradleException(
                "Generated POM exposes embedded Tomcat to consumers: ${forbiddenConsumerTomcatModules.sort()}"
            )
        }
    }
}

tasks.withType(JavaCompile) {
    //prevent warning messages during compile
    options.compilerArgs += ['-Xlint:none']
    //needed for Spring
    options.compilerArgs += ['-parameters']
}

<!doctype html><html lang="en"><meta charset="utf-8"><title>Style picker autotest</title>
<style>body {margin:24px;font:16px sans-serif;} body.is-edit-mode section {margin-top:8px;margin-bottom:8px} #autotest-inline{min-height:140px;border:1px solid #999;padding:12px} .red {color:#b00} .blue {color:#00b} .bg-dark{background:#222;color:white} .bg-light{background:#eee;color:black}</style>
<script src="/admin/skins/webjet8/ckeditor/dist/ckeditor.js"></script>
<div id="autotest-toolbar"></div><section id="autotest-section" class="structural bg-light"><div id="autotest-inline" contenteditable="true"><p>Autotest inline content</p></div></section>
<div id="autotest-modal"><textarea id="autotest-classic"></textarea></div>
<script>
CKEDITOR.disableAutoInline = true;
window.autotestErrors = [];
window.addEventListener('error', function(event) { autotestErrors.push(event.message); });
const styles = [
 {name:'Paragraph',element:'p'},
 {name:'Small',element:'p',attributes:{class:'small'},wj:{tag:'p',category:'Typography',group:'Size'}},
 {name:'Large',element:'p',attributes:{class:'large'},wj:{tag:'p',category:'Typography',group:'Size'}},
 {name:'Bold',element:'p',attributes:{class:'bold'},wj:{tag:'p',category:'Typography',group:'Weight'}},
 {name:'Heading appearance',element:['h1','h2','h3'],attributes:{class:'hero'},wj:{tag:'*',targets:'h1 h2 h3',category:'Typography',group:'Size'}},
 {name:'<b>Červená</b>',element:'span',attributes:{class:'red'},wj:{tag:'span',category:'Text color',group:'Color'}},
 {name:'Blue',element:'span',attributes:{class:'blue'},wj:{tag:'span',category:'Text color',group:'Color'}},
 {name:'Light',element:'section',attributes:{class:'bg-light'},wj:{tag:'section',category:'Background',group:'Background'}},
 {name:'Dark',element:'section',attributes:{class:'bg-dark'},wj:{tag:'section',category:'Background',group:'Background'}},
 {name:'Alert info',element:'div',attributes:{class:'alert info'},wj:{tag:'div',category:'Alerts',group:'Tone',base:'alert'}},
 {name:'Alert warning',element:'div',attributes:{class:'alert warning'},wj:{tag:'div',category:'Alerts',group:'Tone',base:'alert'}},
 {name:'Link',element:'a',attributes:{class:'link-style'},wj:{tag:'a',category:'Links'}},
 {name:'Cell',element:'td',attributes:{class:'cell-style'},wj:{tag:'td',category:'Tables'}},
 {name:'Image',element:'img',attributes:{class:'image-style'},wj:{tag:'img',category:'Images'}}
];
const mode = new URLSearchParams(location.search).get('mode') || 'classic';
if (new URLSearchParams(location.search).has('modal')) {
 const modal = document.getElementById('autotest-modal');
 modal.className = 'modal';
 modal.setAttribute('role', 'dialog');
 modal.tabIndex = -1;
 document.addEventListener('focusin', event => {
  if (!modal.contains(event.target)) modal.focus();
 });
}
const config = {customConfig:'',plugins:'wysiwygarea,toolbar,button,undo,format,sharedspace,wjstylescombo',language:'en',skin:'moono',allowedContent:true,toolbar:[['Format','WJStyles','Undo','Redo']],stylesSet:styles,height:300,contentsCss:[]};
if (mode === 'inline') {
 document.body.classList.add('is-edit-mode');
 document.getElementById('autotest-classic').remove();
 config.sharedSpaces = {top:'autotest-toolbar'};
 config.wjstylescombo_scope = function() {return document.getElementById('autotest-section');};
 window.autotestEditor = CKEDITOR.inline('autotest-inline',config);
} else {
 document.getElementById('autotest-section').remove();
 window.autotestEditor = CKEDITOR.replace('autotest-classic',config);
}
window.autotestSelect = function(id,endId,startOffset,endOffset) {
 const editor=autotestEditor,element=editor.document.getById(id),range=editor.createRange();
 editor.focus();
 if (element.getName()==='img') editor.getSelection().selectElement(element);
 else {
  const end=endId ? editor.document.getById(endId):element;
  range.setStart(element.getFirst(),startOffset || 0);
  range.setEnd(end.getFirst(),endOffset===undefined ? end.getFirst().getLength():endOffset);
  editor.getSelection().selectRanges([range]);
 }
 editor.wjstylescombo.capture();
};
window.autotestApply = function(label) {
 const picker=autotestEditor.wjstylescombo;
 picker.apply(picker.items.find(item=>item.label===label),false);
};
</script></html>

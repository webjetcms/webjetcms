<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Toolbar overflow autotest</title>
<link rel="stylesheet" href="/admin/v9/dist/css/vendor-inline.style.css">
<style>
    body { margin: 16px; font: 16px sans-serif; min-height: 700px; }
    #autotest-shell { position: relative; width: 1200px; }
    #autotest-shell .exit-inline-editor { display: block; position: absolute; z-index: 200; top: 10px; right: 8px; width: 124px; background: #f3f3f6; }
    #autotest-inline { min-height: 160px; padding: 16px; }
    #autotest-outside { margin-left: 600px; }
</style>
<script src="/admin/skins/webjet8/ckeditor/dist/ckeditor.js"></script>
<div id="autotest-shell" class="DTE_Field">
    <div id="autotest-toolbar"></div>
    <div class="exit-inline-editor">Editor:<br><select aria-label="Editor"><option>Page Builder</option><option>Standard</option></select><br>Phone / Tablet / Desktop</div>
    <div id="autotest-inline" contenteditable="true"><p id="one">Autotest selected text.</p></div>
    <textarea id="autotest-classic"><p id="one">Autotest selected text.</p></textarea>
</div>
<button id="autotest-outside">Outside the editor</button>
<script type="module">
    import { CkEditorToolbarOverflow } from '/wjtoolbar-helper-autotest.js';
    CKEDITOR.disableAutoInline = true;
    window.autotestErrors = [];
    window.addEventListener('error', event => autotestErrors.push(event.message));
    const query = new URLSearchParams(location.search);
    const mode = query.get('mode');
    const config = {
        customConfig: '', language: 'en', skin: 'moono', allowedContent: true,
        plugins: 'wysiwygarea,toolbar,button,undo,basicstyles,clipboard,list,indent,indentlist,justify,link,find,format,stylescombo,colorbutton,colordialog,sharedspace,wjstylescombo',
        toolbar: [
            { name: 'clipboard', items: ['Cut', 'Copy', 'Paste'] },
            { name: 'fontAndStyle', items: [query.has('wjstyles') ? 'WJStyles' : 'Styles', 'Bold', 'Italic', 'TextColor'] },
            { name: 'paragraph', items: ['BulletedList', 'NumberedList', 'JustifyLeft', 'JustifyCenter'] },
            { name: 'insert', items: ['Link', 'Unlink'] },
            { name: 'tools', items: ['Undo', 'Redo', 'Find', 'Replace'] }
        ],
        stylesSet: [{ name: 'Autotest red', element: 'span', attributes: { class: 'autotest-red' }, wj: { category: 'Color' } }],
        contentsCss: [], height: 240,
        on: { instanceReady(event) {
            const editor = event.editor;
            window.autotestToolbar = new CkEditorToolbarOverflow(editor, CKEDITOR, { more: 'More tools', close: 'Close' });
            window.autotestOriginalGroups = autotestToolbar.groups.map(group => group.element);
            editor.focus();
            window.autotestReady = true;
        } }
    };
    if (mode === 'inline') {
        document.getElementById('autotest-classic').remove();
        config.sharedSpaces = { top: 'autotest-toolbar' };
        window.autotestEditor = CKEDITOR.inline('autotest-inline', config);
    } else {
        document.getElementById('autotest-inline').remove();
        window.autotestEditor = CKEDITOR.replace('autotest-classic', config);
    }
    window.autotestSelect = () => {
        autotestEditor.focus();
        const range = autotestEditor.createRange();
        const text = autotestEditor.document.getById('one').getFirst();
        range.setStart(text, 0);
        range.setEnd(text, 8);
        autotestEditor.getSelection().selectRanges([range]);
        autotestEditor.wjstylescombo?.capture();
    };
</script>
</html>

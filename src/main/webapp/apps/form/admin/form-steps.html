<script type="text/javascript" src="/components/_common/javascript/jquery.browser.js"></script>
<script type="text/javascript" src="/components/_common/cleditor/jquery.cleditor.js"></script>
<script type="text/javascript" src="/components/_common/cleditor/jquery.cleditor.icon.js"></script>

<script data-th-inline="javascript">
    window.helpLink = "/redactor/apps/multistep-form/README";

    let itemsColumns = /*[(${layout.getDataTableColumns("sk.iway.iwcm.components.multistep_form.jpa.FormItemEntity")})]*/ '';
    let itemTabs = /*[(${layout.getDataTableTabs("sk.iway.iwcm.components.multistep_form.jpa.FormItemEntity")})]*/ '';
    let itemUrl = "/admin/rest/form-items";

    let stepColumns = /*[(${layout.getDataTableColumns("sk.iway.iwcm.components.multistep_form.jpa.FormStepEntity")})]*/ '';
    let stepUrl = "/admin/rest/form-steps";
    let stepTabs = [
        { id: 'main', title: /*[[\#{datatable.tab.basic}]]*/ '', selected: true },
        { id: 'advanced', title: /*[[\#{datatable.tab.advanced}]]*/ '', selected: false },
        { id: 'stepBonusHtml', title: /*[[\#{components.insert_script.body}]]*/ '', content: "<div></div>" }
    ];

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const urlFormName = urlParams.get('formName');

    const isArchived = false;
    const formClipboardUserId = /*[[${layout.user.userId}]]*/ 0;
    const formClipboardDomain = /*[[${layout.header.currentDomain}]]*/ '';

    WJ.breadcrumb({
        id: isArchived ? "form-details-archived" : "form-details",
        tabs: [
            {
                url: (isArchived ? "/apps/form/admin/archived/detail/?formName=" : "/apps/form/admin/detail/?formName=") + urlFormName,
                title: urlFormName,
                active: true
            }
        ],
        backlink: {
            url: isArchived ? "/apps/form/admin/archived/" : "/apps/form/admin/",
            title: WJ.translate("forms.formsList.js"),
        }
    });
</script>

<script type="text/javascript">
    var formStepsDataTable;
    var formItemsDataTable;
    var loadingPreview = false;
    var loadingStepItems = false;
    var stepsFirstLoad = true;
    var itemsFirstLoad = true;

    async function loadPreviewCssTemplates() {
        const select = document.getElementById("previewCssTemplate");
        if(select == null) return;

        select.addEventListener("change", applyPreviewCssTemplate);
        try {
            const response = await fetch("/admin/rest/form-steps/css-templates", {
                method: "GET",
                headers: { "Accept": "application/json", "X-CSRF-Token": window.csrfToken }
            });
            if(response.ok == false) throw new Error(`HTTP ${response.status}`);

            const templates = await response.json();
            if(Array.isArray(templates) == false) throw new Error("Invalid CSS templates response");
            templates.forEach(template => {
                const option = document.createElement("option");
                option.textContent = template.label;
                option.value = template.value;
                select.appendChild(option);
            });
        } catch(error) {
            console.error("Error fetching CSS templates:", error);
        }
    }

    function applyPreviewCssTemplate() {
        document.getElementById("formStepPreviewCssTemplate")?.remove();

        const cssPath = document.getElementById("previewCssTemplate")?.value;
        const preview = document.querySelector("div.stepPreview");
        if(preview == null) return;
        preview.removeAttribute("data-multistep-css-template");
        if(cssPath == null || cssPath === "") return;

        preview.setAttribute("data-multistep-css-template", cssPath);

        const stylesheet = document.createElement("link");
        stylesheet.id = "formStepPreviewCssTemplate";
        stylesheet.rel = "stylesheet";
        stylesheet.type = "text/css";
        stylesheet.href = cssPath;
        preview.appendChild(stylesheet);
    }

    function getActualPath(stepId) {
        let urlWithParams = WJ.urlUpdateParam(itemUrl, "formName", urlFormName);
        urlWithParams = WJ.urlUpdateParam(urlWithParams, "stepId", stepId);
        return urlWithParams;
    }

    /** Shares saved field settings between form editors without copying ownership or conditions. */
    function initFormItemClipboard(userId, domain) {
        const table = formItemsDataTable;
        const editor = table.EDITOR;
        const storageKey = 'webjet.multistepform.clipboard.' + userId + '.' + encodeURIComponent(domain);
        const lifetime = 30 * 60 * 1000;
        const fields = {
            fieldType: 'string', label: 'string', required: 'boolean', trimValue: 'boolean',
            regexValidationArr: 'array', value: 'string', placeholder: 'string', tooltip: 'string',
            customError: 'string', useValueAsEnumeration: 'boolean', valueAsOptions: 'string', valueAsEnumeration: 'string',
            showStat: 'boolean', chartType: 'string', topCount: 'number', showOtherCount: 'boolean',
            showUnanswered: 'boolean', compareInsensitive: 'boolean', useColorScheme: 'boolean', colorScheme: 'string'
        };
        let expiryTimer;
        let copying = false;
        let pendingPaste = null;
        let pasted = false;

        /** Validates and selects only editable settings from server data or an untrusted snapshot. */
        function configuration(source) {
            if (!source || typeof source.fieldType !== 'string' || !source.fieldType) return null;
            const item = {};
            for (const [name, type] of Object.entries(fields)) {
                const value = source[name];
                if (value === undefined) continue;
                if (value !== null && (type === 'array'
                    ? !Array.isArray(value) || !value.every(Number.isInteger)
                    : typeof value !== type || (type === 'number' && !Number.isFinite(value)))) return null;
                item[name] = value;
            }
            item.regexValidationArr = item.regexValidationArr || [];
            return item;
        }

        function readClipboard() {
            try {
                const snapshot = JSON.parse(window.localStorage.getItem(storageKey));
                if (!snapshot) return null;
                const item = configuration(snapshot.item);
                if (snapshot.version !== 1 || !Number.isFinite(snapshot.expiresAt) || snapshot.expiresAt <= Date.now() || !item) {
                    window.localStorage.removeItem(storageKey);
                    return null;
                }
                return { item, expiresAt: snapshot.expiresAt };
            } catch (error) { /* Restricted storage or malformed JSON leaves paste disabled. */ }
            return null;
        }

        function selectedStep() {
            const steps = formStepsDataTable.rows({ selected: true }).data().toArray();
            const loadedStep = new window.URL(table.getAjaxUrl(), window.location.origin).searchParams.get('stepId');
            return steps.length === 1 && String(steps[0].id) === loadedStep ? steps[0].id : null;
        }

        function supported(item) {
            return table.DATA.jsonOptions?.fieldType?.some(option => option.value === item.fieldType) === true;
        }

        function refreshClipboard() {
            window.clearTimeout(expiryTimer);
            const snapshot = readClipboard();
            const busy = copying || pendingPaste !== null || editor.display();
            table.button('copyField:name').enable(!busy && table.rows({ selected: true }).count() === 1);
            table.button('pasteField:name').enable(!busy && selectedStep() !== null && snapshot !== null && supported(snapshot.item));
            if (snapshot) expiryTimer = window.setTimeout(refreshClipboard, Math.min(lifetime, snapshot.expiresAt - Date.now()));
        }

        table.button().add(3, {
            name: 'copyField',
            text: '<i class="ti ti-clipboard" aria-hidden="true"></i>',
            className: 'btn btn-outline-secondary buttons-copy-field',
            attr: { title: WJ.translate('components.form_items.clipboard.copy.js'), 'aria-label': WJ.translate('components.form_items.clipboard.copy.js'), 'data-toggle': 'tooltip' },
            enabled: false,
            action: async function() {
                const selected = table.rows({ selected: true }).data().toArray();
                if (copying || selected.length !== 1) return;
                copying = true;
                refreshClipboard();
                try {
                    const response = await fetch(WJ.urlAddPath(table.getAjaxUrl(), '/' + selected[0].id), {
                        headers: { 'Accept': 'application/json', 'X-CSRF-Token': window.csrfToken }
                    });
                    if (!response.ok) throw new Error('Cannot load form item');
                    const item = configuration(await response.json());
                    if (!item) throw new Error('Invalid form item');
                    window.localStorage.setItem(storageKey, JSON.stringify({ version: 1, item, expiresAt: Date.now() + lifetime }));
                    WJ.notifySuccess(WJ.translate('components.form_items.clipboard.copied.js'), '', 5000);
                } catch (error) {
                    WJ.notifyError(WJ.translate('components.form_items.clipboard.error.js'));
                } finally {
                    copying = false;
                    refreshClipboard();
                }
            }
        });
        table.button().add(4, {
            name: 'pasteField',
            text: '<i class="ti ti-clipboard-plus" aria-hidden="true"></i>',
            className: 'btn btn-outline-secondary buttons-paste-field buttons-divider',
            attr: { title: WJ.translate('components.form_items.clipboard.paste.js'), 'aria-label': WJ.translate('components.form_items.clipboard.paste.js'), 'data-toggle': 'tooltip' },
            enabled: false,
            action: function() {
                const snapshot = readClipboard();
                const stepId = selectedStep();
                if (pendingPaste || editor.display() || copying || stepId === null) return;
                if (!snapshot || !supported(snapshot.item)) {
                    WJ.notifyError(WJ.translate('components.form_items.clipboard.unavailable.js'));
                    refreshClipboard();
                    return;
                }
                pendingPaste = { item: snapshot.item, stepId };
                refreshClipboard();
                table.wjCreate();
            }
        });

        // Apply the copied configuration after fetchOnCreate has loaded the destination defaults.
        editor.on('preOpen', function(e, mode, action) {
            if (action !== 'create' || !pendingPaste) return;
            const paste = pendingPaste;
            pendingPaste = null;
            editor.setJson({
                ...editor.currentJson, ...paste.item,
                id: -1, itemFormId: '', formName: urlFormName, stepId: paste.stepId,
                visibilityConditions: [], requirementConditions: [], allowSaveWhenCondition: false,
                errorCount: 0
            });
            pasted = true;
        });
        editor.on('open', function() {
            if (pasted) WJ.notifyInfo(WJ.translate('components.form_items.clipboard.paste.js'), WJ.translate('components.form_items.clipboard.conditions.js'), 10000);
            refreshClipboard();
        });
        editor.on('close cancelOpen initEdit initRemove', function() {
            pendingPaste = null;
            pasted = false;
            refreshClipboard();
        });
        table.on('select deselect draw', refreshClipboard);
        formStepsDataTable.on('select deselect draw', refreshClipboard);
        window.addEventListener('storage', function(event) {
            if (event.key === storageKey || event.key === null) refreshClipboard();
        });
        window.addEventListener('focus', refreshClipboard);
        window.addEventListener('pagehide', function() { window.clearTimeout(expiryTimer); });
        window.addEventListener('pageshow', refreshClipboard);
        refreshClipboard();
    }

    window.renderStepName = function(data, type, row, meta) {
        if(type === "display" || type === "filter") {
            //combine row number with prefix Step X and stepName (if not empty) and stepSubName (if not empty)
            let metaRow = meta.row;
            if(typeof metaRow === "number") { metaRow = Number(meta.row) + 1; }
            else if(typeof metaRow === "object") { metaRow = Number(meta.row[0]) + 1; }
            else { metaRow = "" }

            let displayName = `<span class="text-muted small">[[#{components.form_items.step_title}]] ${metaRow}</span>`;
            let secondRow = "";
            if(row.stepName && row.stepName.trim() !== "") {
                secondRow += `${row.stepName}`;
            }
            if (row.stepSubName && row.stepSubName.trim() !== "") {
                secondRow += ` (${row.stepSubName})`;
            }
            return displayName + (secondRow ? `<br/>${secondRow}` : "");
        }
        return data;
    }

    window.domReady.add(function () {
        loadPreviewCssTemplates();

        WJ.headerTabs({
            id: 'tabsFilter',
            tabs: [
                { url: '/apps/form/admin/', title: WJ.translate('forms.formsList.js'), active: false },
                { url: '/apps/form/admin/form-steps/?formName=' + urlFormName, title: WJ.translate('components.form_items.navbar_title.js'), active: true },
                { url: '/apps/form/admin/form-stats/?formName=' + urlFormName, title: WJ.translate('components.form_stat.navbar_title.js'), active: false },
                { url: '/apps/form/admin/archived/', title: WJ.translate('forms.archiveList.js'), active: false },
                { url: '/apps/form/admin/regexps/', title: WJ.translate('components.form.reg_exp.js'), active: false }
            ]
        });

        formStepsDataTable = WJ.DataTable({
            url: WJ.urlUpdateParam(stepUrl, "formName", urlFormName),
            serverSide: true,
            columns: stepColumns,
            tabs: stepTabs,
            id: "formStepsDataTable",
            fetchOnEdit: true,
            fetchOnCreate: true,
            idAutoOpener: false,
            toggleStyle: "single",
            toggleSelector: "td",
            paging: false,
            onXhr: function() {
                loadingStepItems = false;
                if (stepsFirstLoad === true) {
                    stepsFirstLoad = false;
                    setTimeout(() => {
                        let steps = $("#formStepsDataTable tbody tr");
                        if(steps.length > 0) {
                            let tdS = $(steps[0]).find("td");
                            if(tdS.length > 0) {
                                $(tdS[1]).click();
                            }
                        }
                    }, 800);
                }
            }
        });
        formStepsDataTable.hideButtons(["import", "export", "celledit"]);

        formStepsDataTable.on('select.dt.DT', function () {
            if(loadingStepItems === true) return;
            loadingStepItems = true;

            let selectedStep = null;
            let attempts = 0;
            const maxAttempts = 50; // 5 seconds max (50 * 100ms)

            const checkInterval = setInterval(() => {
                selectedStep = $(`#formStepsDataTable tbody tr.selected`);
                attempts++;

                if(selectedStep.length > 0) {
                    clearInterval(checkInterval);

                    const stepId = selectedStep[0].getAttribute("id");
                    // reload form items table for current step
                    formItemsDataTable.setAjaxUrl(getActualPath(stepId));
                    formItemsDataTable.ajax.reload();

                    loadStepPreview();
                } else if(attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    console.log("Max attempts reached, no selected step found");
                    loadingStepItems = false;
                }
            }, 100);
        });

        formStepsDataTable.on('deselect.dt.DT', function () {
            setTimeout(() => {
                //Clear table only if no row is selected (deselect is called allso when another row is selected)
                if (formStepsDataTable.rows({ selected: true }).any()) { return; }
                // I dont want to call DRAW/reload to clear table, call cost performance
                formItemsDataTable.clear();
                $("table#formItemsDataTable tbody").html('<tr><td colspan="2" class="dt-empty">' + WJ.translate('datatables.defaults.empty_table.js') + '</td></tr>');
                const stepPreview = document.querySelector("div.stepPreview");
                if (window.WebJETFormTooltip && typeof window.WebJETFormTooltip.dispose === "function") window.WebJETFormTooltip.dispose(stepPreview);
                $(stepPreview).html("");
            }, 0);
        });

        formStepsDataTable.on("draw", function() { loadStepPreview(); });

        var order = [];
        order.push([1, 'desc']);

        formItemsDataTable = WJ.DataTable({
            url: getActualPath(-1),
            serverSide: true,
            columns: itemsColumns,
            tabs: itemTabs,
            order: order,
            id: "formItemsDataTable",
            fetchOnEdit: true,
            fetchOnCreate: true,
            idAutoOpener: false,
            toggleStyle: "single",
            toggleSelector: "td",
            paging: false,
            onXhr: function() {
                loadingStepItems = false;
            }
        });
        formItemsDataTable.hideButtons(["import", "export", "celledit"]);

        initFormItemClipboard(formClipboardUserId, formClipboardDomain);

        formItemsDataTable.on("draw", function() { loadStepPreview(); });

        let regexRequestId = 0;
        formItemsDataTable.EDITOR.on('initCreate initEdit initRemove close cancelOpen', function() {
            // Responses belong to the editor session in which the field type changed.
            regexRequestId++;
        });

        formItemsDataTable.EDITOR.on( 'open', function( e, mode, action ) {

            if("create" === action) {
                ["visibilityConditions", "requirementConditions"].forEach(tabId => {
                    $("#pills-dt-formItemsDataTable-" + tabId + "-tab").hide();
                });
            }

            if(itemsFirstLoad === true) {
                itemsFirstLoad = false;

                $("#DTE_Field_fieldType").on("change", function(event, data) {
                    const requestId = ++regexRequestId;
                    const selectedFieldType = $(this).val();
                    const hiddenFieldsByType = formItemsDataTable.DATA.jsonOptions.hiddenFieldsByType;
                    const inputTypeByFieldType = formItemsDataTable.DATA.jsonOptions.inputType;

                    let itsCreateAction = false;

                    const editDialog = $("div.DTE.DTE_Action_Edit");
                    $("#pills-dt-formItemsDataTable-stat-tab").show();
                    if(editDialog != undefined && editDialog != null && editDialog.length) {
                        // Its edit

                        // Reset condition tabs before applying selected type specific hidden tabs.
                        ["visibilityConditions", "requirementConditions"].forEach(tabId => {
                            $("#pills-dt-formItemsDataTable-" + tabId + "-tab").show();
                        });

                        //
                        itsCreateAction = false;
                    } else {
                        itsCreateAction = true;
                    }

                    const hiddenTabsByType = formItemsDataTable.DATA.jsonOptions.hiddenTabsByType;
                    hiddenTabsByType.forEach(tab => {
                        if(tab.value === selectedFieldType) {
                            let label = tab.label;
                            if(label != null && label.trim().length > 0) {
                                label.split(",").map(s => s.trim()).forEach(tabId => {
                                    $("#pills-dt-formItemsDataTable-" + tabId + "-tab").hide();
                                });
                            }
                        }
                    });

                    let fieldsToHide = [];
                    for(let i = 0; i < hiddenFieldsByType.length; i++) {
                        if(hiddenFieldsByType[i].value == selectedFieldType) {
                            const hideFieldsStr = hiddenFieldsByType[i].label;
                            fieldsToHide = hideFieldsStr.split(",").map(field => field.trim());
                            break;
                        }
                    }

                    const allwaysHidden = hiddenFieldsByType
                        .find(field => field.value === "allwaysHidden")
                        ?.label
                        .split(',')
                        .map(s => s.trim());

                    const hiddenOnCreate = hiddenFieldsByType
                        .find(field => field.value === "hiddenOnCreate")
                        ?.label
                        .split(',')
                        .map(s => s.trim());

                    formItemsDataTable.EDITOR.fields().forEach(function(fieldName) {
                        if(fieldsToHide.includes(fieldName)) {
                            formItemsDataTable.EDITOR.field(fieldName).hide();
                        } else if(itsCreateAction && hiddenOnCreate.includes(fieldName)) {
                            formItemsDataTable.EDITOR.field(fieldName).hide();
                        } else if(allwaysHidden.includes(fieldName) == false) {
                            formItemsDataTable.EDITOR.field(fieldName).show();
                        }

                        if(allwaysHidden.includes(fieldName)) {
                            // like id or formName
                            formItemsDataTable.EDITOR.field(fieldName).hide();
                        }
                    });

                    // Special logic for value field
                    setTimeout(() => {
                        let inputType = "text";
                        inputTypeByFieldType.forEach(type => {
                            if(type.value === selectedFieldType) {
                                inputType = type.label;
                            }
                        });
                        //console.log("Selected field type: " + selectedFieldType + ", input type: " + inputType);

                        if(formItemsDataTable.EDITOR.field("value").displayed() === true) {
                            // It has meaning only if value field is showed
                            if("iterable" === inputType) {
                                formItemsDataTable.EDITOR.field("value").hide();

                                formItemsDataTable.EDITOR.field("useValueAsEnumeration").show();
                                toggleValueAsFields();
                            } else {
                                formItemsDataTable.EDITOR.field("value").show();

                                formItemsDataTable.EDITOR.field("valueAsOptions").hide();
                                formItemsDataTable.EDITOR.field("valueAsEnumeration").hide();
                                formItemsDataTable.EDITOR.field("useValueAsEnumeration").hide();
                            }
                        } else {
                            // value field is hidden, hide valueAsOptions too
                            formItemsDataTable.EDITOR.field("valueAsOptions").hide();
                            formItemsDataTable.EDITOR.field("valueAsEnumeration").hide();
                            formItemsDataTable.EDITOR.field("useValueAsEnumeration").hide();
                        }
                    }, 500);

                    if(data?.editor !== true && formItemsDataTable.EDITOR.display() && selectedFieldType !== formItemsDataTable.EDITOR.currentJson["fieldType"]) {
                        // Editor resets and setJson changes must preserve saved or copied validators.
                        fetch(`/admin/rest/form-items/default-regex?fieldType=${selectedFieldType}`, {
                            method: "GET",
                            headers: { "X-CSRF-Token": window.csrfToken }
                        })
                        .then(res => res.json())
                        .then(regexIds => {
                            if(requestId !== regexRequestId || formItemsDataTable.EDITOR.display() === false) return;
                            formItemsDataTable.EDITOR.field("regexValidationArr").val([]);
                            if(regexIds != null && Array.isArray(regexIds) && regexIds.length > 0) {
                                // regexIds is now an array of Long values
                                formItemsDataTable.EDITOR.field("regexValidationArr").val(regexIds)
                            }
                        })
                        .catch(err => console.error(err));
                    }
                });

                function toggleValueAsFields() {
                    const useEnum = formItemsDataTable.EDITOR.field("useValueAsEnumeration").val();
                    const checked = (Array.isArray(useEnum) ? useEnum[0] : useEnum) === true;
                    if(checked) {
                        formItemsDataTable.EDITOR.field("valueAsOptions").hide();
                        formItemsDataTable.EDITOR.field("valueAsEnumeration").show();
                    } else {
                        formItemsDataTable.EDITOR.field("valueAsOptions").show();
                        formItemsDataTable.EDITOR.field("valueAsEnumeration").hide();
                    }
                }

                // add listener
                document.getElementById("DTE_Field_useValueAsEnumeration_0").addEventListener("change",
                    function() { toggleValueAsFields(); }
                );

                $("#DTE_Field_showStat_0").on("change", function() {
                    const statAllowed = formItemsDataTable.EDITOR.field("showStat").val()[0];

                    if(statAllowed === true) {
                        formItemsDataTable.EDITOR.field("chartType").show();
                        formItemsDataTable.EDITOR.field("topCount").show();
                        formItemsDataTable.EDITOR.field("showOtherCount").show();
                        formItemsDataTable.EDITOR.field("showUnanswered").show();
                        formItemsDataTable.EDITOR.field("compareInsensitive").show();
                        formItemsDataTable.EDITOR.field("useColorScheme").show();
                        formItemsDataTable.EDITOR.field("colorScheme").show();
                    } else {
                        formItemsDataTable.EDITOR.field("chartType").hide();
                        formItemsDataTable.EDITOR.field("topCount").hide();
                        formItemsDataTable.EDITOR.field("showOtherCount").hide();
                        formItemsDataTable.EDITOR.field("showUnanswered").hide();
                        formItemsDataTable.EDITOR.field("compareInsensitive").hide();
                        formItemsDataTable.EDITOR.field("useColorScheme").hide();
                        formItemsDataTable.EDITOR.field("colorScheme").hide();
                    }
                });

                $("#DTE_Field_useColorScheme_0").on("change", function() {
                    const useColorScheme = formItemsDataTable.EDITOR.field("useColorScheme").val()[0];
                    if(useColorScheme) {
                        formItemsDataTable.EDITOR.field("colorScheme").enable();
                    } else {
                        formItemsDataTable.EDITOR.field("colorScheme").disable();
                    }
                });
            }
        });
    });

    let conditionsWithoutValue = ["EMPTY", "NOT_EMPTY"];
    let visibilityConditionsDataTable = null;
    let requirementConditionsDataTable = null;
    window.addEventListener("WJ.DTE.innerTableInitialized", function(event) {
        if (event.detail.conf.id == "DTE_Field_visibilityConditions" && visibilityConditionsDataTable == null) {
            visibilityConditionsDataTable = event.detail.conf.datatable;
            bindTableEvent(visibilityConditionsDataTable);
        } else if(event.detail.conf.id == "DTE_Field_requirementConditions" && requirementConditionsDataTable == null) {
            requirementConditionsDataTable = event.detail.conf.datatable;
            bindTableEvent(requirementConditionsDataTable);
        }
    });

    function bindTableEvent(table) {
        table.EDITOR.on('open', function(e, mode, action) {
            $("#" + table.DATA.id + "_modal #DTE_Field_operator").on("change", function() {
                const operator = table.EDITOR.field("operator").val();
                if(conditionsWithoutValue.includes(operator.toUpperCase())) {
                    table.EDITOR.field("value").hide();
                    table.EDITOR.field("caseInsensitive").hide();
                } else {
                    table.EDITOR.field("value").show();
                    table.EDITOR.field("caseInsensitive").show();
                }
            });

            if (table.DATA.id === "datatableFieldDTE_Field_visibilityConditions") {
                $("#datatableFieldDTE_Field_visibilityConditions_modal #DTE_Field_infolabel").text("[[#{components.form_items_condition.infolabel.visibility}]]");
            } else if (table.DATA.id === "datatableFieldDTE_Field_requirementConditions") {
                $("#datatableFieldDTE_Field_requirementConditions_modal #DTE_Field_infolabel").text("[[#{components.form_items_condition.infolabel.requirement}]]");
            }
        });
    }

    async function loadStepPreview() {
        if(loadingPreview === false) { loadingPreview = true; }
        else { return; }

        let selectedStep = $(`#formStepsDataTable tbody tr.selected`);
        if(selectedStep.length === 0) {
            const stepPreview = document.querySelector("div.stepPreview");
            if (window.WebJETFormTooltip && typeof window.WebJETFormTooltip.dispose === "function") window.WebJETFormTooltip.dispose(stepPreview);
            $(stepPreview).html("");
            loadingPreview = false;
            return;
        }

        const stepId = selectedStep[0].getAttribute("id");
        const getStepUrl = `/admin/rest/form-steps/get-step?form-name=${encodeURIComponent(urlFormName)}&step-id=${encodeURIComponent(stepId)}&language=${encodeURIComponent(window.userLng)}`;
        try {
            const r = await fetch(getStepUrl, { method: 'GET', headers: { 'Accept': 'text/html,application/json', "X-CSRF-Token": window.csrfToken } });
            if (!r.ok) {
                const raw = await r.text();
                try {
                    let parsed;
                    try { parsed = JSON.parse(raw); } catch (_) { parsed = { raw }; }
                    await this.showGlobalErr(parsed);
                } catch (e) { /* ignore */ }
            }
            const html = await r.text();

            let formTooltip = null;
            try {
                ({ formTooltip } = await import("/apps/form/mvc/multistep-form.js"));
            } catch (error) {
                console.warn("Failed to load form tooltips:", error);
            }

            const stepPreview = document.querySelector("div.stepPreview");
            if (formTooltip) formTooltip.dispose(stepPreview);
            $(stepPreview).html(html);
            if (formTooltip) formTooltip.init(stepPreview);

            applyPreviewCssTemplate();

            onResize();

            // init wysiwyg inside preview
            window.setTimeout(() => {
                if (window.$ && $.fn && $.fn.cleditor) {
                    $("div.stepPreview").find("textarea.formsimple-wysiwyg").cleditor({
                        width: '100%',
                        controls: 'bold italic underline bullets numbering outdent indent image link icon size color highlight pastetext',
                        bodyStyle: 'font: 11px  Arial, Helvetica, sans-serif;'
                    });
                }
            }, 100);

            window.setTimeout(() => {
                loadingPreview = false;
            }, 100);
        } catch (error) {
            console.error("Error fetching step preview:", error);
            loadingPreview = false;
        }
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            onResize();
        }, 500);
    });

    setInterval(() => {
        onResize();
    }, 2000);

    function onResize() {
        let height = $("#formStepsDataTable_wrapper").innerHeight() - $("#formStepsDataTable_wrapper").find("div.dt-header-row").innerHeight() - 10;
        $("div.stepPreview").css("height", height + "px");
    }
</script>

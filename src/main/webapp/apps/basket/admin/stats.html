<script type="text/javascript" data-th-inline="javascript">

    const basketStatsUrl = "/admin/rest/eshop/stats";
    const revenueWithVatSeriesLabel = '[[#{apps.eshop.stats.revenue}]]';
    const revenueWithoutVatSeriesLabel = '[[#{apps.eshop.stats.revenue_without_vat}]]';
    const chartForms = {};
    let chartsInitialized = false;

    WJ.breadcrumb({
        id: "stats",
        tabs: [
            {
                url: '/apps/basket/admin/stats/',
                title: '[[#{apps.eshop.stats.title}]]',
                active: true
            },
            {
                url: '#dateRange',
                title: '{filter}',
                active: false
            }
        ]
    });

    window.domReady.add(async function () {
        $("#pills-dateRange-tab").html("");
        $("#basketStatsFilter").appendTo("#pills-dateRange-tab");

        initializeDatePickers();
        await ChartTools.setSelect(
            "/admin/rest/eshop/product-list/supported-currencies",
            null,
            "currencySelect",
            false
        );
        bindFilter();
        loadStats();
    });

    function initializeDatePickers() {
        $('#basketStatsFilter .datepicker').each(function (key, dateInput) {
            const $input = $(dateInput);
            if ($input.hasClass("datepickerbinded")) return;
            $input.addClass("datepickerbinded");

            new $.fn.dataTable.Editor.DateTime($input, {
                format: 'L',
                momentLocale: window.userLng,
                locale: window.userLng,
                keyInput: false,
                i18n: WJ.getDatetimeLocalization()
            });
        });
    }

    function bindFilter() {
        $("#currencySelect").on("change", function () {
            loadStats();
        });

        const filterButton = document.querySelector("#basketStatsFilter button.dt-filtrujem-dayDate");
        if (filterButton == null) return;

        filterButton.addEventListener("click", function (event) {
            event.preventDefault();
            loadStats();
        });

        document.querySelectorAll("#basketStatsFilter input.filter-input").forEach(input => {
            input.addEventListener("keypress", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    loadStats();
                }
            });
        });
    }

    function getStatsUrl() {
        const params = new URLSearchParams();
        params.set("dayDate", ChartTools.getDateRange(null));
        params.set("currency", $("#currencySelect").val());
        return basketStatsUrl + "?" + params.toString();
    }

    async function loadStats() {
        WJ.showLoader();

        try {
            const response = await fetch(getStatsUrl(), {
                headers: {
                    "X-CSRF-Token": window.csrfToken
                }
            });
            if (!response.ok) throw new Error("Statistics request failed with status " + response.status);

            const data = await response.json();
            updateSummary(data);

            if (chartsInitialized === false) {
                await createCharts(data);
                chartsInitialized = true;
            } else {
                await updateCharts(data);
            }
        } catch (error) {
            console.error("Error fetching e-shop statistics:", error);
            WJ.notifyError(
                '[[#{apps.eshop.stats.load_error.title}]]',
                '[[#{apps.eshop.stats.load_error.text}]]'
            );
        } finally {
            WJ.hideLoader();
        }
    }

    function updateSummary(data) {
        document.getElementById("invoiceCount").textContent = formatCount(data.invoiceCount);
        document.getElementById("revenue").textContent = formatMoney(data.revenue, data.currency);
        document.getElementById("averageInvoiceValue").textContent = formatMoney(data.averageInvoiceValue, data.currency);
        document.getElementById("soldItemCount").textContent = formatCount(data.soldItemCount);
    }

    function formatCount(value) {
        return Number(value || 0).toLocaleString();
    }

    function formatMoney(value, currency) {
        const currencyLabel = currency == null ? "" : " " + currency.toUpperCase();
        return WJ.formatPrice(value || 0) + currencyLabel;
    }

    function getSalesChartData(data) {
        const series = {};
        const timeline = data.salesTimeline || [];
        series[revenueWithVatSeriesLabel] = timeline.map(point => ({
            dayDate: point.dayDate,
            revenue: point.revenueWithVat
        }));
        series[revenueWithoutVatSeriesLabel] = timeline.map(point => ({
            dayDate: point.dayDate,
            revenue: point.revenueWithoutVat
        }));
        return ChartTools.convertDataForLineChart(series);
    }

    function getRevenueChartTitle(data) {
        const currencyLabel = data.currency == null ? "" : " (" + data.currency.toUpperCase() + ")";
        return '[[#{apps.eshop.stats.revenue_chart}]]' + currencyLabel;
    }

    async function createCharts(data) {
        await window.initAmcharts();

        chartForms.sales = new ChartTools.LineChartForm({
            yAxeNames: ChartTools.getLineChartYAxeNameObjs(["revenue"], [undefined]),
            xAxeName: "dayDate",
            chartTitle: getRevenueChartTitle(data),
            chartDivId: "basketStats-sales",
            chartData: getSalesChartData(data),
            dateType: ChartTools.DateType.Auto
        });

        chartForms.products = new ChartTools.BarChartForm({
            yAxeName: "name",
            xAxeName: "count",
            chartTitle: '[[#{apps.eshop.stats.top_products}]]',
            chartDivId: "basketStats-products",
            chartData: data.topProducts || [],
            horizontal: true
        });

        chartForms.categories = new ChartTools.TreeChartForm({
            chartTitle: '[[#{apps.eshop.stats.top_categories}]]',
            chartDivId: "basketStats-categories",
            chartData: data.categoryTree,
            topDepth: 1,
            initialDepth: 10,
            downDepth: 10,
            labelText: "{category}\n[bold]{sum}[/]"
        });

        chartForms.delivery = createPieChart(
            "basketStats-delivery",
            '[[#{apps.eshop.stats.delivery_methods}]]',
            data.deliveryMethods
        );
        chartForms.payment = createPieChart(
            "basketStats-payment",
            '[[#{apps.eshop.stats.payment_methods}]]',
            data.paymentMethods
        );
        chartForms.statuses = createPieChart(
            "basketStats-statuses",
            '[[#{apps.eshop.stats.invoice_statuses}]]',
            data.invoiceStatuses
        );

        Object.values(chartForms).forEach(chart => ChartTools.createAmchart(chart));
    }

    function createPieChart(chartDivId, chartTitle, chartData) {
        return new ChartTools.PieChartForm({
            yAxeName: "count",
            xAxeName: "name",
            chartTitle: chartTitle,
            chartDivId: chartDivId,
            chartData: chartData || [],
            innerRadius: 65,
            legendValueText: "[bold]{count}[/]"
        });
    }

    async function updateCharts(data) {
        chartForms.sales.chartData = getSalesChartData(data);
        chartForms.sales.chartTitle = getRevenueChartTitle(data);
        chartForms.products.chartData = data.topProducts || [];
        chartForms.categories.chartData = data.categoryTree;
        chartForms.delivery.chartData = data.deliveryMethods || [];
        chartForms.payment.chartData = data.paymentMethods || [];
        chartForms.statuses.chartData = data.invoiceStatuses || [];

        for (const chart of Object.values(chartForms)) {
            await ChartTools.updateChart(chart);
        }
    }

</script>

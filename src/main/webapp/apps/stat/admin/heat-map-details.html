<link rel="stylesheet" href="/apps/stat/admin/heat-map.css">
<script data-th-inline="javascript">
    if (window !== window.parent) document.documentElement.classList.add("pg-heatmap-embedded");
    const heatMapTexts = {
        title: /*[[#{stat_menu.heat_map}]]*/ "Click map",
        loading: /*[[#{components.stat.heatmap.loading}]]*/ "Loading…",
        empty: /*[[#{components.stat.heatmap.empty}]]*/ "No clicks in this period.",
        emptyVersion: /*[[#{components.stat.heatmap.emptyVersion}]]*/ "No clicks were recorded on the days this version was live in the selected period.",
        emptyWidth: /*[[#{components.stat.heatmap.emptyWidth}]]*/ "No clicks were recorded for this version at the selected width.",
        error: /*[[#{components.stat.heatmap.error}]]*/ "The click map could not be loaded.",
        previewError: /*[[#{components.stat.heatmap.previewError}]]*/ "The page preview is unavailable.",
        tileError: /*[[#{components.stat.heatmap.tileError}]]*/ "Some map tiles could not be loaded. Reload the preview.",
        clicks: /*[[#{components.stat.heatmap.clicks}]]*/ "Clicks",
        areaLoading: /*[[#{components.stat.heatmap.areaLoading}]]*/ "Counting clicks…",
        areaResult: /*[[#{components.stat.heatmap.areaResult}]]*/ "Area: {clicks} of {total} clicks · {percent}%",
        areaError: /*[[#{components.stat.heatmap.areaError}]]*/ "The area count could not be loaded. Select the area again.",
        hotspot: /*[[#{components.stat.heatmap.hotspot}]]*/ "Hotspot {rank}",
        hotspotsLoading: /*[[#{components.stat.heatmap.hotspotsLoading}]]*/ "Loading hotspots…",
        hotspotsError: /*[[#{components.stat.heatmap.hotspotsError}]]*/ "Hotspots could not be loaded. Reload the preview.",
        hotspotsTop: /*[[#{components.stat.heatmap.hotspotsTop}]]*/ "Top {count}: {clicks} clicks · {percent}%",
        hotspotsOther: /*[[#{components.stat.heatmap.hotspotsOther}]]*/ "Other areas: {clicks} clicks · {percent}%",
        hotspotResult: /*[[#{components.stat.heatmap.hotspotResult}]]*/ "{name}: {clicks} of {total} clicks · {percent}%",
        version: /*[[#{components.stat.heatmap.version}]]*/ "Page version",
        versionA: /*[[#{components.stat.heatmap.versionA}]]*/ "Version A",
        versionB: /*[[#{components.stat.heatmap.versionB}]]*/ "Version B",
        container: /*[[#{components.stat.heatmap.container}]]*/ "Container",
        window: /*[[#{components.stat.heatmap.window}]]*/ "Window",
        containerMissing: /*[[#{components.stat.heatmap.containerMissing}]]*/ "The click map cannot be displayed: the preview has no matching centered container of width {width} px.",
        fallback: /*[[#{components.stat.heatmap.fallback}]]*/ "A historical version could not be identified. Current content is shown.",
        multiple: /*[[#{components.stat.heatmap.multiple}]]*/ "The content changed during this period. Clicks from multiple versions are combined. Versions that were live on the same day share that day’s clicks.",
        unavailable: /*[[#{components.stat.heatmap.unavailable}]]*/ "No page content is available for this preview."
    };
</script>
<script type="module">
    import { HeatMapViewer } from "/apps/stat/admin/heat-map-viewer.js";
    window.domReady.add(function () {
        if (window === window.parent) {
            WJ.breadcrumb({id: "heatMapDetails", tabs: [
                {url: "/apps/stat/admin/heat-map/", title: "[[#{stat_menu.heat_map}]]", active: true}
            ]});
        }
        const viewer = new HeatMapViewer(document.getElementById("heatMapViewer"), heatMapTexts);
        viewer.init();
    });
</script>

<section id="heatMapViewer" class="pg-heatmap" aria-busy="true">
    <div class="pg-heatmap-heading">
        <a id="heatMapBack" class="btn btn-sm btn-outline-secondary pg-heatmap-icon" href="/apps/stat/admin/heat-map/" data-th-title="#{components.stat.heatmap.back}">
            <i class="ti ti-arrow-left" aria-hidden="true"></i><span class="visually-hidden" data-th-text="#{components.stat.heatmap.back}"></span>
        </a>
        <h2 id="heatMapTitle" class="h5 mb-0" data-th-text="#{stat_menu.heat_map}"></h2>
    </div>
    <div class="pg-heatmap-controls">
        <div class="pg-heatmap-control-group pg-heatmap-display">
            <div class="pg-heatmap-width">
                <label for="heatMapWidth" data-th-text="#{components.stat.heatmap.width}"></label>
                <select id="heatMapWidth" class="form-select form-select-sm no-picker" disabled></select>
            </div>
            <div class="pg-heatmap-scale">
                <label for="heatMapScale" data-th-text="#{components.stat.heatmap.scale}"></label>
                <select id="heatMapScale" class="form-select form-select-sm no-picker">
                    <option value="fit" data-th-text="#{components.stat.heatmap.fit}"></option>
                    <option value="1">100 %</option>
                    <option value="0.75">75 %</option>
                    <option value="0.5">50 %</option>
                </select>
            </div>
        </div>
        <div class="pg-heatmap-control-group pg-heatmap-layer">
            <button id="heatMapVisible" class="btn btn-sm btn-primary pg-heatmap-icon" type="button" aria-pressed="true" data-th-title="#{components.stat.heatmap.show}">
                <i class="ti ti-eye" aria-hidden="true"></i><span class="visually-hidden" data-th-text="#{components.stat.heatmap.show}"></span>
            </button>
            <div class="pg-heatmap-opacity">
                <label for="heatMapOpacity"><span data-th-text="#{components.stat.heatmap.opacity}"></span> <output id="heatMapOpacityValue" for="heatMapOpacity">65 %</output></label>
                <input id="heatMapOpacity" class="form-range" type="range" min="0" max="100" step="5" value="65">
            </div>
        </div>
        <div class="pg-heatmap-control-group pg-heatmap-actions">
            <button id="heatMapSelectArea" class="btn btn-sm btn-outline-secondary pg-heatmap-icon" type="button" aria-pressed="false" data-th-title="#{components.stat.heatmap.selectArea}" disabled>
                <i class="ti ti-crop" aria-hidden="true"></i><span class="visually-hidden" data-th-text="#{components.stat.heatmap.selectArea}"></span>
            </button>
            <button id="heatMapCompare" class="btn btn-sm btn-outline-secondary pg-heatmap-icon" type="button" aria-pressed="false" data-th-title="#{components.stat.heatmap.compare}" disabled>
                <i class="ti ti-layout-columns" aria-hidden="true"></i><span class="visually-hidden" data-th-text="#{components.stat.heatmap.compare}"></span>
            </button>
            <button id="heatMapHotspots" class="btn btn-sm btn-primary pg-heatmap-icon" type="button" aria-pressed="true" aria-controls="heatMapHotspotPanel" data-th-title="#{components.stat.heatmap.hotspots}">
                <i class="ti ti-list-numbers" aria-hidden="true"></i><span class="visually-hidden" data-th-text="#{components.stat.heatmap.hotspots}"></span>
            </button>
            <button id="heatMapReload" class="btn btn-sm btn-outline-secondary pg-heatmap-icon" type="button" data-th-title="#{components.stat.heatmap.reload}" disabled>
                <i class="ti ti-refresh" aria-hidden="true"></i><span class="visually-hidden" data-th-text="#{components.stat.heatmap.reload}"></span>
            </button>
        </div>
    </div>
    <span id="heatMapAreaHelp" class="visually-hidden" data-th-text="#{components.stat.heatmap.areaHelp}"></span>
    <div class="pg-heatmap-content">
      <div id="heatMapPreviews" class="pg-heatmap-previews">
        <section id="heatMapPane" class="pg-heatmap-pane">
            <div id="heatMapPaneLabel" class="pg-heatmap-pane-label" hidden>
                <label id="heatMapVersionLabel" for="heatMapVersion" data-th-text="#{components.stat.heatmap.version}"></label>
                <select id="heatMapVersion" class="form-select form-select-sm no-picker">
                    <option value="" data-th-text="#{components.stat.heatmap.allVersions}"></option>
                </select>
            </div>
            <div id="heatMapStatus" class="alert alert-info" role="status" aria-live="polite" data-th-text="#{components.stat.heatmap.loading}"></div>
            <div id="heatMapViewport" class="pg-heatmap-viewport d-none">
                <div id="heatMapStageSize" class="pg-heatmap-stage-size">
                    <div id="heatMapStage" class="pg-heatmap-stage">
                        <iframe id="heatMapFrame" class="pg-heatmap-frame" data-th-title="#{components.stat.heatmap.previewTitle}" referrerpolicy="same-origin"></iframe>
                        <div id="heatMapOverlay" class="pg-heatmap-overlay" aria-hidden="true">
                            <div id="heatMapTiles" class="pg-heatmap-tiles"></div>
                        </div>
                        <div id="heatMapAreaLayer" class="pg-heatmap-area-layer" hidden role="group" data-th-aria-label="#{components.stat.heatmap.selectArea}" aria-describedby="heatMapAreaHelp">
                            <div id="heatMapAreaBox" class="pg-heatmap-area-box" hidden aria-hidden="true"></div>
                        </div>
                        <div id="heatMapHotspotLayer" class="pg-heatmap-hotspot-layer" hidden>
                            <div id="heatMapHotspotBox" class="pg-heatmap-hotspot-box" hidden aria-hidden="true"></div>
                            <div id="heatMapHotspotMarkers" class="pg-heatmap-hotspot-markers"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="heatMapSummary" class="pg-heatmap-summary" hidden>
                <div class="pg-heatmap-total" role="status" aria-live="polite" aria-atomic="true">
                    <strong id="heatMapTotalClicks"></strong>
                    <span id="heatMapScaleSummary"></span>
                </div>
                <div id="heatMapAreaResult" class="pg-heatmap-area-result" hidden>
                    <span id="heatMapAreaCount" role="status" aria-live="polite" aria-atomic="true"></span>
                    <button id="heatMapClearArea" class="btn btn-sm btn-outline-secondary pg-heatmap-icon" type="button" data-th-title="#{components.stat.heatmap.clearArea}">
                        <i class="ti ti-x" aria-hidden="true"></i><span class="visually-hidden" data-th-text="#{components.stat.heatmap.clearArea}"></span>
                    </button>
                </div>
                <div class="pg-heatmap-legend">
                    <span data-th-text="#{components.stat.heatmap.fewerClicks}"></span>
                    <span class="pg-heatmap-legend-gradient" aria-hidden="true"></span>
                    <span data-th-text="#{components.stat.heatmap.moreClicks}"></span>
                </div>
            </div>
        </section>
      </div>
      <aside id="heatMapHotspotPanel" class="pg-heatmap-hotspot-panel" aria-labelledby="heatMapHotspotHeading">
        <div class="pg-heatmap-hotspot-heading">
            <h3 id="heatMapHotspotHeading" class="h6 mb-1" data-th-text="#{components.stat.heatmap.hotspotsTitle}"></h3>
            <p class="mb-0" data-th-text="#{components.stat.heatmap.hotspotsHelp}"></p>
        </div>
        <p id="heatMapHotspotStatus" class="pg-heatmap-hotspot-status" role="status" aria-live="polite"></p>
        <div id="heatMapHotspotColumns" class="pg-heatmap-hotspot-columns" hidden aria-hidden="true">
            <span data-th-text="#{components.stat.heatmap.hotspotsArea}"></span>
            <span data-th-text="#{components.stat.heatmap.clicks}"></span>
            <span data-th-text="#{components.stat.heatmap.hotspotsShare}"></span>
        </div>
        <ol id="heatMapHotspotList" class="pg-heatmap-hotspot-list"></ol>
        <template id="heatMapHotspotRow">
            <li>
                <button type="button" class="pg-heatmap-hotspot-row" aria-pressed="false">
                    <span class="pg-heatmap-hotspot-name"><span class="pg-heatmap-hotspot-number" aria-hidden="true"></span></span>
                    <strong></strong>
                    <span class="pg-heatmap-hotspot-share"></span>
                    <span class="pg-heatmap-hotspot-bar" aria-hidden="true"></span>
                </button>
            </li>
        </template>
        <div id="heatMapHotspotTotals" class="pg-heatmap-hotspot-totals" hidden>
            <div id="heatMapHotspotTop"></div>
            <div id="heatMapHotspotOther"></div>
        </div>
        <p id="heatMapHotspotResult" class="pg-heatmap-hotspot-result" hidden role="status" aria-live="polite" aria-atomic="true"></p>
      </aside>
    </div>
</section>

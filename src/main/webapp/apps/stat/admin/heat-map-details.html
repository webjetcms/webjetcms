<link rel="stylesheet" href="/apps/stat/admin/heat-map.css">
<script data-th-inline="javascript">
    if (window !== window.parent) document.documentElement.classList.add("pg-heatmap-embedded");
    const heatMapTexts = {
        loading: /*[[#{components.stat.heatmap.loading}]]*/ "Loading…",
        empty: /*[[#{components.stat.heatmap.empty}]]*/ "No clicks in this period.",
        error: /*[[#{components.stat.heatmap.error}]]*/ "The click map could not be loaded.",
        previewError: /*[[#{components.stat.heatmap.previewError}]]*/ "The page preview is unavailable.",
        tileError: /*[[#{components.stat.heatmap.tileError}]]*/ "Some map tiles could not be loaded. Reload the preview.",
        clicks: /*[[#{components.stat.heatmap.clicks}]]*/ "Clicks",
        fallback: /*[[#{components.stat.heatmap.fallback}]]*/ "A historical version could not be identified. Current content is shown.",
        multiple: /*[[#{components.stat.heatmap.multiple}]]*/ "The content changed during this period. Clicks from multiple versions are combined.",
        unavailable: /*[[#{components.stat.heatmap.unavailable}]]*/ "No page content is available for this preview."
    };
</script>
<script type="module">
    import { HeatMapViewer } from "/apps/stat/admin/heat-map-viewer.js";
    window.domReady.add(function () {
        if (window === window.parent) {
            WJ.breadcrumb({id: "heatMapDetails", tabs: [
                {url: "/apps/stat/admin/heat-map/", title: "[[#{stat_menu.heat_map}]]", active: true}
            ]});
        }
        const viewer = new HeatMapViewer(document.getElementById("heatMapViewer"), heatMapTexts);
        viewer.init();
    });
</script>

<section id="heatMapViewer" class="pg-heatmap" aria-busy="true">
    <div class="pg-heatmap-heading">
        <a id="heatMapBack" class="btn btn-sm btn-outline-secondary" href="/apps/stat/admin/heat-map/">
            <i class="ti ti-arrow-left" aria-hidden="true"></i> <span data-th-text="#{components.stat.heatmap.back}"></span>
        </a>
        <h2 id="heatMapTitle" class="h5 mb-0" data-th-text="#{stat_menu.heat_map}"></h2>
    </div>
    <div class="pg-heatmap-controls">
        <div class="pg-heatmap-control-group pg-heatmap-display">
            <div class="pg-heatmap-width">
                <label for="heatMapWidth" data-th-text="#{components.stat.heatmap.width}"></label>
                <select id="heatMapWidth" class="form-select form-select-sm no-picker" disabled></select>
            </div>
            <div class="pg-heatmap-scale">
                <label for="heatMapScale" data-th-text="#{components.stat.heatmap.scale}"></label>
                <select id="heatMapScale" class="form-select form-select-sm no-picker">
                    <option value="fit" data-th-text="#{components.stat.heatmap.fit}"></option>
                    <option value="1">100 %</option>
                    <option value="0.75">75 %</option>
                    <option value="0.5">50 %</option>
                </select>
            </div>
        </div>
        <div class="pg-heatmap-control-group pg-heatmap-layer">
            <div class="form-check form-switch">
                <input id="heatMapVisible" class="form-check-input" type="checkbox" role="switch" checked>
                <label for="heatMapVisible" class="form-check-label" data-th-text="#{components.stat.heatmap.show}"></label>
            </div>
            <div class="pg-heatmap-opacity">
                <label for="heatMapOpacity"><span data-th-text="#{components.stat.heatmap.opacity}"></span> <output id="heatMapOpacityValue" for="heatMapOpacity">65 %</output></label>
                <input id="heatMapOpacity" class="form-range" type="range" min="0" max="100" step="5" value="65">
            </div>
        </div>
        <button id="heatMapReload" class="btn btn-sm btn-outline-secondary" type="button" data-th-title="#{components.stat.heatmap.reload}" disabled>
            <i class="ti ti-refresh" aria-hidden="true"></i><span class="visually-hidden" data-th-text="#{components.stat.heatmap.reload}"></span>
        </button>
    </div>
    <div id="heatMapNotice" class="alert alert-warning d-none" role="status"></div>
    <div id="heatMapStatus" class="alert alert-info" role="status" aria-live="polite" data-th-text="#{components.stat.heatmap.loading}"></div>
    <div id="heatMapViewport" class="pg-heatmap-viewport d-none">
        <div id="heatMapStageSize" class="pg-heatmap-stage-size">
            <div id="heatMapStage" class="pg-heatmap-stage">
                <iframe id="heatMapFrame" class="pg-heatmap-frame" data-th-title="#{components.stat.heatmap.previewTitle}" referrerpolicy="same-origin"></iframe>
                <div id="heatMapOverlay" class="pg-heatmap-overlay" aria-hidden="true">
                    <div id="heatMapTiles" class="pg-heatmap-tiles"></div>
                </div>
            </div>
        </div>
    </div>
</section>

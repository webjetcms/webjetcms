# WebJET CMS - Spring Boot Configuration
# Migrated from Spring Web to Spring Boot 4.x

# Server configuration
server.servlet.context-path=/
server.tomcat.basedir=.

# HTTPS port 443
# HTTP port 80 is added by TomcatPortConfiguration customizer
server.port=443
# Redirect HTTP to HTTPS
server.tomcat.redirect-port=443
# Self-signed certificate (generated by the generateCertificate task under build/certificates)
server.ssl.key-store=${WEBJET_KEYSTORE_PATH}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${WEBJET_HTTPS_KEYSTORE_PASSWORD:changeit}
server.ssl.key-alias=tomcat
server.ssl.enabled=true

# Character encoding (default: utf-8)
spring.servlet.encoding.charset=utf-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# Multipart file upload settings
# MaximumPostSize from Constants.java: "5000m" (5000 MB)
spring.servlet.multipart.max-file-size=5000MB
spring.servlet.multipart.max-request-size=5000MB

# Spring Boot 4.x compatibility
spring.main.web-application-type=servlet

# Logging
#logging.level.org.springframework.web=INFO
#logging.level.sk.iway.iwcm=INFO

# Disable Thymeleaf auto-configuration (we use custom WebjetViewResolver)
spring.thymeleaf.enabled=false

# JSP configuration (Spring Boot 4.x)
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp
spring.mvc.view.cache=false
# Check JSP changes at runtime (embedded Tomcat Jasper)
server.servlet.jsp.init-parameters.development=true
server.servlet.jsp.init-parameters.modificationTestInterval=1
server.servlet.jsp.init-parameters.checkInterval=1

# Error pages (Spring Boot 4.x - no BasicErrorController)
# Disable /error endpoint, error pages handled by ErrorPageRegistrar in BaseSpringConfig
#OLD: v3 error.path=
#OLD: v3 error.whitelabel.enabled=false
server.error.whitelabel.enabled=false
server.error.path=/error

# Session persistence (Spring Boot 4.x - embedded Tomcat)
# File-based session persistence replaces the old META-INF/context.xml PersistentManager.
# Sessions are persisted to ~/.webjetcms/sessions/ on each request and restored on restart.
# See SpringConfig.tomcatSessionPersistenceCustomizer() for configuration.

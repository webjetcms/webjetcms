# WebJET CMS - Spring Boot Configuration
# Migrated from Spring Web to Spring Boot 4.x

# Server configuration
server.servlet.context-path=/
server.tomcat.basedir=.

# Primary HTTPS connector
server.port=443
# Self-signed certificate (generated by the generateCertificate task under build/certificates)
server.ssl.key-store=${WEBJET_KEYSTORE_PATH}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${WEBJET_HTTPS_KEYSTORE_PASSWORD:changeit}
server.ssl.key-alias=tomcat
server.ssl.enabled=true

# Embedded Tomcat opens this HTTP port and redirects every request to server.port.
# Set enabled=false when an upstream proxy owns the HTTP to HTTPS redirect.
webjet.server.http-redirect.enabled=true
webjet.server.http-redirect.port=80

# Character encoding (default: utf-8)
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# Character encoding and multipart size are resolved during WebJET bootstrap
# from defaultEncoding and stripes.FileUpload.MaximumPostSize.
spring.servlet.multipart.file-size-threshold=64KB

# Keep the embedded Tomcat limit aligned with the external development server.
server.tomcat.max-part-count=1000

# WebJET default MIME mappings. Installations can override individual extensions.
server.mime-mappings.properties=text/plain

# Spring Boot 4.x compatibility
spring.main.web-application-type=servlet

# Logging
#logging.level.org.springframework.web=INFO
#logging.level.sk.iway.iwcm=INFO

# Disable Thymeleaf auto-configuration (we use custom WebjetViewResolver)
spring.thymeleaf.enabled=false

# JSP configuration (Spring Boot 4.x)
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp
spring.mvc.view.cache=false
# Check JSP changes at runtime (embedded Tomcat Jasper)
server.servlet.jsp.init-parameters.development=true
server.servlet.jsp.init-parameters.modificationTestInterval=1
server.servlet.jsp.init-parameters.checkInterval=1

# Error handling (Spring Boot 4.x)
# Specific status codes are handled by ErrorPageRegistrar.
# BasicErrorController remains the fallback for other errors.
spring.web.error.whitelabel.enabled=false
spring.web.error.path=/error

# Session persistence (Spring Boot 4.x - embedded Tomcat)
# Sessions are saved on graceful shutdown and restored when the server starts again.
# Per-request persistence would require a PersistentValve and is intentionally not enabled.
server.servlet.session.persistent=true
# Keep the store instance-local; StandardManager writes one SESSIONS.ser file per directory.
server.servlet.session.store-dir=${user.dir}/work/sessions
